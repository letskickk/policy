<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개혁신당 정책 멘토링</title>
  <style>
    /* --- [초기화] --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* --- [메인과 동일한 톤/팔레트] --- */
    :root{
      --bg1:#04162b;
      --bg2:#073053;
      --bg3:#0a3b69;

      --text:#f1f5f9;
      --text-strong:#ffffff;
      --muted:#cbd5e1;

      --brand:#ff7210;

      --card: rgba(255,255,255,0.06);
      --card2: rgba(255,255,255,0.04);
      --border: rgba(148,163,184,0.18);

      --cta:#ffffff;
      --cta-text:#0f172a;
      --cta-hover:#f1f5f9;
      --cta-ring: rgba(56, 189, 248, 0.35);

      --shadow: 0 10px 30px rgba(0,0,0,0.28);
      --shadow2: 0 12px 26px rgba(0,0,0,0.32);

      /* 입력/에러/보조 */
      --input-bg: rgba(0,0,0,0.22);
      --input-bg-focus: rgba(0,0,0,0.30);

      /* ✅ 입력창 테두리(상시) */
      --input-border: rgba(148,163,184,0.28);
      --error-bg: rgba(255, 107, 107, 0.14);
      --error-border: rgba(255, 107, 107, 0.40);
      --error-text: #ffd1d1;
    }

    body{
      font-family: "Malgun Gothic","Apple SD Gothic Neo",sans-serif;
      max-width: 880px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
      min-height: 100vh;
      color: var(--text);
      line-height: 1.6;
      font-size: 16px;

      /* ✅ 메인과 동일한 배경 컨셉 */
      background:
        radial-gradient(1000px 500px at 20% 10%, rgba(255,114,16,0.10), transparent 60%),
        radial-gradient(900px 600px at 90% 20%, rgba(56,189,248,0.10), transparent 60%),
        linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
      background-attachment: fixed;
    }

    /* --- [네비게이션] --- */
    .nav {
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .nav-left { display: flex; align-items: center; gap: 0.5rem; }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-login { color: var(--muted); font-size: 0.88rem; white-space: nowrap; }
    @media (max-width: 640px) {
      .nav { gap: 0.75rem; }
      .nav-right { order: 3; width: 100%; justify-content: space-between; margin-top: 0.25rem; padding-top: 0.75rem; border-top: 1px solid rgba(148,163,184,0.15); }
    }

    .nav-link{
      display:inline-flex;
      align-items:center;
      color: var(--text);
      text-decoration:none;
      font-size: 0.92rem;
      font-weight: 800;
      padding: 0.6rem 1rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }
    .nav-link:hover{
      background: rgba(255,255,255,0.10);
      color: var(--text-strong);
      border-color: rgba(148,163,184,0.28);
    }
    .nav-link:focus-visible{
      outline: none;
      box-shadow: 0 0 0 4px var(--cta-ring);
    }
    /* --- [브랜드] --- */
    .brand-container { margin-bottom: 1.5rem; }
    .brand-logo{
      display:inline-flex;
      align-items:center;
      gap: 0.75rem;
      font-weight: 900;
      font-size: 1.1rem;
      color: var(--text-strong);
      letter-spacing: -0.01em;
    }
    .brand-logo img{
      height: 26px;
      width: auto;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.25));
    }

    /* --- [헤더] --- */
    header { margin-bottom: 2.2rem; }
    h1{
      font-size: 2rem;
      font-weight: 950;
      color: var(--text-strong);
      margin-bottom: 0.75rem;
      letter-spacing: -0.03em;
    }
    .subtitle{
      font-size: 1.05rem;
      color: var(--text);
      font-weight: 600;
      line-height: 1.7;
    }

    /* --- [카드] --- */
    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.75rem;
      margin-bottom: 1.75rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    /* --- [폼] --- */
    .form-label{
      display:block;
      font-size: 1.08rem;
      font-weight: 900;
      color: var(--text-strong);
      margin-bottom: 0.6rem;
      letter-spacing: -0.02em;
    }
    .form-hint{
      font-size: 0.95rem;
      color: var(--text);
      margin-bottom: 1.1rem;
      line-height: 1.6;
    }
    .form-hint strong{
      color: #ffb37a; /* 메인과 동일한 부드러운 강조 */
      font-weight: 900;
    }

    textarea{
      width: 100%;
      min-height: 220px;
      padding: 1.25rem;
      border-radius: 16px;

      border: 1px solid var(--input-border);

      background: var(--input-bg);
      color: var(--text-strong);
      font-size: 1.05rem;
      line-height: 1.65;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.22);
    }
    textarea::placeholder { color: rgba(203,213,225,0.85); }

    textarea:focus{
      border-color: rgba(255,255,255,0.45);
      background: var(--input-bg-focus);
      box-shadow: 0 0 0 4px var(--cta-ring), inset 0 2px 4px rgba(0,0,0,0.22);
    }
    .input-text{
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-strong);
      font-size: 0.98rem;
      outline: none;
      margin-bottom: 0.9rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .input-text:focus{
      border-color: rgba(255,255,255,0.45);
      background: var(--input-bg-focus);
      box-shadow: 0 0 0 4px var(--cta-ring);
    }

    /* --- [버튼: 메인 CTA 톤(화이트)로 통일] --- */
    .btn-primary{
      display:block;
      width: 100%;
      margin-top: 1.25rem;
      padding: 1.05rem 1.25rem;
      font-size: 1.08rem;
      font-weight: 950;
      color: var(--cta-text);
      background: var(--cta);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 14px;
      cursor:pointer;
      transition: transform 0.08s ease, background 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 4px 16px rgba(0,0,0,0.30);
    }
    .btn-primary:hover{
      background: var(--cta-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow2);
    }
    .btn-primary:active{ transform: translateY(0); }
    .btn-primary:focus-visible{
      outline: none;
      box-shadow: 0 0 0 4px var(--cta-ring), var(--shadow2);
    }
    .btn-primary:disabled{
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* --- [결과 영역] --- */
    .result-container{
      min-height: 100px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .result-content{
      width: 100%;
      margin-top: 1rem;
      word-break: break-word;
      line-height: 1.7;
      font-size: 1rem;
      color: var(--text-strong);
    }
    .score-board{
      display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;
      padding:1rem 1.2rem; border-radius:14px;
      background: linear-gradient(135deg, rgba(255,114,16,0.12), rgba(56,189,248,0.10));
      border:1px solid rgba(255,114,16,0.25);
      margin-bottom: 0.85rem;
    }
    .score-board .score{
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text-strong);
    }
    .badge{
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      border-radius: 999px;
      padding: 0.3rem 0.8rem;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    .badge.green{ background: rgba(34,197,94,0.18); color: #86efac; border: 1px solid rgba(34,197,94,0.35); }
    .badge.yellow{ background: rgba(250,204,21,0.18); color: #fef08a; border: 1px solid rgba(250,204,21,0.35); }
    .badge.red{ background: rgba(248,113,113,0.18); color: #fca5a5; border: 1px solid rgba(248,113,113,0.35); }
    .result-actions{ display:flex; gap:0.5rem; margin-top:1rem; flex-wrap:wrap; }
    .btn-secondary{
      padding:0.5rem 1rem; border-radius:10px; font-weight:700; font-size:0.85rem;
      color:var(--text); background:rgba(255,255,255,0.08); border:1px solid var(--border);
      cursor:pointer; transition:all 0.15s;
    }
    .btn-secondary:hover{ background:rgba(255,255,255,0.14); color:var(--text-strong); }
    .btn-secondary:disabled{
      opacity: 0.55;
      cursor: not-allowed;
    }
    .result-summary{
      margin-bottom: 0.6rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      font-size: 0.9rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .metric-chip{
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.3rem 0.55rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(148,163,184,0.25);
    }
    .metric-chip strong{
      color: var(--text-strong);
      font-weight: 900;
    }
    .score-cards-row{
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .score-card{
      flex: 1 1 auto;
      min-width: 110px;
      padding: 0.55rem 0.7rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      border: 1px solid rgba(148,163,184,0.25);
      background: rgba(255,255,255,0.05);
      font-size: 0.8rem;
      line-height: 1.2;
    }
    .score-card-label{
      color: var(--text);
      font-weight: 700;
      white-space: nowrap;
    }
    .score-card-value{
      color: var(--text-strong);
      font-weight: 900;
    }
    .score-card.good{ border-color: rgba(34,197,94,0.45); }
    .score-card.mid{ border-color: rgba(250,204,21,0.45); }
    .score-card.low{ border-color: rgba(248,113,113,0.45); }
    .analysis-text{
      margin-top:0.5rem; white-space:pre-wrap; word-break:break-word;
      line-height:1.7; font-size:1rem; color:var(--text-strong);
    }

    .section-cards{ margin-top:0.9rem; display:flex; flex-direction:column; gap:0.7rem; }
    .section-card{
      border:1px solid rgba(148,163,184,0.28); border-radius:12px;
      background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03)); overflow:hidden;
    }
    .section-card-head{
      display:flex; align-items:center; justify-content:space-between; gap:0.6rem;
      padding:0.55rem 0.8rem; border-bottom:1px solid rgba(148,163,184,0.22); background:rgba(2,6,23,0.25);
    }
    .section-card-title{ font-weight:900; color:var(--text-strong); font-size:0.94rem; }
    .section-card-body{ padding:0.7rem 0.8rem; line-height:1.7; color:var(--text-strong); }
    .section-line{ margin-top:0.35rem; }
    .section-line:first-child{ margin-top:0; }
    .section-line.item{ margin-top:0.5rem; }
    .line-tag{ font-size:0.75rem; font-weight:800; color:#93c5fd; border:1px solid rgba(147,197,253,0.4); border-radius:999px; padding:0.15rem 0.5rem; }
    /* 4번 섹션 유사 공약 카드 */
    .winners-card{
      margin: 0.65rem 0;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      border-left: 4px solid #ffb37a;
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: rgba(255,179,122,0.06);
    }
    .winners-card-header{
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.45rem;
    }
    .winners-card-badge{
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      background: rgba(255,179,122,0.18);
      color: #ffb37a;
      font-size: 0.78rem;
      font-weight: 900;
      white-space: nowrap;
    }
    .winners-card-title{
      font-weight: 900;
      color: var(--text-strong);
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .winners-card-meta{
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.35rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .winners-card-meta span{
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }
    .winners-card-body{
      font-size: 0.9rem;
      line-height: 1.65;
      color: var(--text);
    }
    .winners-card-label{
      display: inline-block;
      padding: 0.15rem 0.4rem;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 800;
      margin-right: 0.3rem;
    }
    .winners-card-label.similar{ background: rgba(34,197,94,0.15); color: #86efac; }
    .winners-card-label.same{ background: rgba(96,165,250,0.15); color: #93c5fd; }
    .winners-card-label.reference{ background: rgba(250,204,21,0.15); color: #fef08a; }
    .result-content.empty{
      text-align:center;
      color: var(--text);
      font-weight: 700;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      height: 100%;
      padding: 2rem 0;
      line-height: 1.6;
    }

    .loading-state{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 1rem;
      color: var(--text-strong);
      font-weight: 800;
    }
    .spinner{
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.12);
      border-top-color: #ffb37a; /* 메인 보조 강조색 */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-message{
      padding: 1rem 1.25rem;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      border-radius: 14px;
      font-weight: 700;
      display:flex;
      align-items:center;
      gap: 0.75rem;
    }
    .error-message::before{ content:"⚠️"; }

    .disclaimer-box{
      margin-top: 1.35rem;
      padding: 1.1rem 1.25rem;
      background: rgba(0,0,0,0.18);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 0.92rem;
      color: var(--text);
      line-height: 1.7;
    }
    .disclaimer-box strong{
      color: #ffb37a;
      font-weight: 900;
    }

    .footer{
      margin-top: 2.6rem;
      text-align:center;
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.8;
    }
    .footer a{
      color: #ffb37a;
      text-decoration:none;
      font-weight: 900;
    }
    .footer a:hover{ text-decoration: underline; }

    @media (max-width: 640px){
      body { padding: 1.5rem 1rem 2.5rem; }
      h1 { font-size: 1.75rem; }
      .card { padding: 1.25rem; border-radius: 16px; }
      textarea { min-height: 180px; }
    }
  </style>
</head>

<body>
  <nav class="nav">
    <div class="nav-left">
      <a href="/" class="nav-link">← 메인</a>
      <a href="/dashboard" class="nav-link">내 기록</a>
    </div>
    <div class="nav-right">
      <span id="loginInfo" class="nav-login"></span>
    </div>
  </nav>

  <div class="brand-container">
    <div class="brand-logo">
      <img src="https://www.reformparty.kr/theme/basic/download/Logo_01.svg" alt="개혁신당 로고">
      공약 멘토링
    </div>
  </div>

  <header>
    <h1>개혁신당 정책 멘토링</h1>
    <p class="subtitle">작성하신 공약을 입력하면 당의 정강정책 및 기존 공약과의 정합성을 AI가 분석해 드립니다.</p>
  </header>

  <main>
    <section class="card">
      <label for="pledge" class="form-label">공약 내용 입력</label>
      <p class="form-hint">
        아래 구조처럼 작성하면 분석 정확도가 높아집니다: <strong>(배경) → (실행방안) → (기대효과)</strong>
      </p>
      <textarea id="pledge" placeholder="여기에 공약 내용을 입력해 주세요&#13;&#10;&lt;예시&gt;&#13;&#10;(제목) AI 기반 통학버스 안전 3대 혁신방안&#13;&#10;이제는 AI가 아이들의 안전벨트가 됩니다&#13;&#10;(배경) 통학버스는 다양한 교육기관에서 운행되지만 안전장비 의무화가 미흡하고 사고 대응이 수동 신고 중심이라 골든타임 지연 위험이 존재함&#13;&#10;(실행방안) ① 통학버스 음주운전 시동잠금장치 도입 및 신규 차량 의무화 ② AI 사고대응 시스템 구축(EDR 기반 중증도 분석 + 병원/구급차 자동 연계) ③ 교통안전공단 내 전담기구 설치로 범부처 연계 운영&#13;&#10;(기대효과) ▲ 음주사고 원천 차단 ▲ 사고 시 골든타임 확보 및 치명률 감소 ▲ 기술 기반 교통안전 체계 확산 기반 마련"></textarea>
      <button type="button" id="btn" class="btn-primary">AI 분석 시작하기</button>
    </section>

    <section class="card">
      <h2 class="form-label">분석 결과</h2>
      <div class="result-container">
        <div id="result" class="result-content empty">
          <div style="font-size: 2rem; margin-bottom: 0.5rem;">🧐</div>
공약 내용을 입력하고<br>'AI 분석 시작하기' 버튼을 눌러주세요.
        </div>
      </div>
      <div class="disclaimer-box">
        본 분석 결과는 <strong><bold>AI를 활용하여 작성된 참고 자료</strong></bold>입니다.<br>
        최종 정책 수립 과정에서 검토를 <strong><bold>보조하는 용도로 활용</strong></bold>해 주시기 바랍니다.
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>
      <strong>개혁신당 정책국</strong><br>
      문의: <a href="mailto:letskick@reformparty.kr">letskick@reformparty.kr</a>
    </p>
  </footer>

  <script>
    (async function() {
      try {
        const r = await fetch('/api/auth/me', { credentials: 'include' });
        const el = document.getElementById('loginInfo');
        if (r.ok && el) {
          const d = await r.json();
          if (d.email) {
            const e = String(d.email).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            el.innerHTML = e + ' 로그인 중 · <form action="/api/auth/logout" method="POST" style="display:inline"><button type="submit" style="background:none;border:none;color:#ffb37a;font-weight:700;cursor:pointer;padding:0;font-size:inherit;">로그아웃</button></form>';
          }
        }
      } catch (e) {}
    })();
    const pledgeEl = document.getElementById('pledge');
    const resultEl = document.getElementById('result');
    const btnEl = document.getElementById('btn');

    const emptyMessage = '<div style="font-size: 2rem; margin-bottom: 0.5rem;">🧐</div>공약 내용을 입력하고<br>\'AI 분석 시작하기\' 버튼을 눌러주세요.';

    function showResult(text) {
      resultEl.innerHTML = text;
      resultEl.className = 'result-content';
    }

    function showError(text) {
      resultEl.innerHTML = `<div class="error-message">${text}</div>`;
      resultEl.className = 'result-content';
    }

    function showLoading() {
      resultEl.innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <span>AI가 정책 데이터를 분석하고 있습니다...</span>
          <small style="display:block;margin-top:0.5rem;color:var(--muted);font-weight:600;">최대 1~2분 걸릴 수 있습니다. 잠시만 기다려 주세요.</small>
        </div>
      `;
      resultEl.className = 'result-content';
      btnEl.disabled = true;
      btnEl.textContent = '분석 진행 중...';
    }

    function resetBtn() {
      btnEl.disabled = false;
      btnEl.textContent = 'AI 분석 시작하기';
    }

    function signalLabel(signal) {
      if (signal === 'green') return '양호';
      if (signal === 'yellow') return '보완 권고';
      return '보완 필요';
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

    function toNumber(v) {
      return (typeof v === 'number' && !Number.isNaN(v)) ? v : null;
    }

    function normalizeOutputText(text) {
      const s = String(text || '');
      return s.replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    }

    function renderRubricList(title, items) {
      if (!Array.isArray(items) || items.length === 0) return '';
      const rows = items.map(it => {
        const item = escapeHtml(it && it.item ? it.item : '-');
        const score = (it && typeof it.score_0_5 === 'number') ? `${it.score_0_5}/5` : '-';
        const note = escapeHtml(it && it.note ? it.note : '');
        return `
          <div style="padding:0.6rem 0.75rem;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,0.04);margin-bottom:0.5rem;">
            <div style="display:flex;justify-content:space-between;gap:0.5rem;flex-wrap:wrap;">
              <strong style="color:var(--text-strong);">${item}</strong>
              <span style="font-weight:800;color:#ffb37a;">${score}</span>
            </div>
            ${note ? `<div style="margin-top:0.35rem;color:var(--text);font-size:0.92rem;line-height:1.6;">${note}</div>` : ''}
          </div>
        `;
      }).join('');
      return `
        <div style="margin-top:0.9rem;">
          <div style="font-weight:900;color:var(--text-strong);margin-bottom:0.45rem;">${escapeHtml(title)}</div>
          ${rows}
        </div>
      `;
    }

    function renderCombinedResult(baseText, data) {
      // 총평 섹션에서 점수 파싱
      let totalScore = null;
      let platformFitScore = null;
      let designScore = null;
      let feasibilityScore = null;
      let specificityScore = null;
      let messageScore = null;

      if (baseText) {
        const lines = String(baseText).split(/\r?\n/).map(s => s.trim());
        const pickNum = (line) => {
          if (!line) return null;
          const m = line.match(/(\d+(?:\.\d+)?)/);
          return m ? toNumber(Number(m[1])) : null;
        };
        const findByKeyword = (...keywords) => {
          const line = lines.find(l => keywords.every(k => l.includes(k)));
          return pickNum(line);
        };

        // 총평 종합점수 (형식 흔들려도 라인 기준으로 추출)
        totalScore =
          findByKeyword("결과", "종합", "점수") ??
          findByKeyword("종합", "점수");

        // 5축 점수 (라벨 라인 기준)
        platformFitScore = findByKeyword("정강정책", "부합도");
        designScore = findByKeyword("정책", "설계", "완성도");
        feasibilityScore = findByKeyword("실행", "가능성");
        specificityScore = findByKeyword("구체성");
        messageScore = findByKeyword("메시지", "경쟁력");
      }

      // 총평 축점수 기반 가중 합(총평 내부 규칙) 계산
      function weightedTotalFromAxes() {
        const axes = [
          { v: platformFitScore, w: 0.30 },
          { v: designScore, w: 0.25 },
          { v: feasibilityScore, w: 0.20 },
          { v: specificityScore, w: 0.15 },
          { v: messageScore, w: 0.10 }
        ].filter(x => x.v !== null);
        if (!axes.length) return null;
        const wSum = axes.reduce((a, b) => a + b.w, 0);
        const vSum = axes.reduce((a, b) => a + (b.v * b.w), 0);
        return Math.round((vSum / wSum) * 10) / 10;
      }

      // 1순위: 총평의 종합 점수, 2순위: 총평 5축 가중합, 3순위: verify 점수
      if (totalScore === null) {
        totalScore = weightedTotalFromAxes();
      }
      if (totalScore === null) {
        totalScore = toNumber(data && data.total_score) ?? toNumber(data && data.fit_score);
      }

      const signal = (totalScore !== null ? (totalScore >= 80 ? 'green' : (totalScore >= 60 ? 'yellow' : 'red')) : (data && data.signal_light || 'red')).toLowerCase();
      const board = (totalScore !== null)
        ? `<div class="score-board"><div class="score">총점: ${totalScore.toFixed(1)}점</div><span class="badge ${signal}">${signalLabel(signal)}</span></div>`
        : '';

      let html = board;
      const hasScores = platformFitScore !== null || designScore !== null || feasibilityScore !== null || specificityScore !== null || messageScore !== null;
      if (hasScores) {
        const scoreCards = [];
        const scores = [
          { label: '정강정책 부합도', value: platformFitScore },
          { label: '정책 설계 완성도', value: designScore },
          { label: '실행 가능성', value: feasibilityScore },
          { label: '구체성', value: specificityScore },
          { label: '메시지 경쟁력', value: messageScore }
        ];
        
        scores.forEach(item => {
          if (item.value !== null) {
            const cls = item.value >= 80 ? 'good' : (item.value >= 60 ? 'mid' : 'low');
            scoreCards.push(`
              <div class="score-card ${cls}">
                <span class="score-card-label">${item.label}</span>
                <span class="score-card-value">${item.value.toFixed(0)}</span>
              </div>
            `);
          }
        });
        
        if (scoreCards.length > 0) {
          html += `<div class="score-cards-row">${scoreCards.join('')}</div>`;
        }
      }

      function splitSections(text) {
        const lines = String(text || '').split(/\r?\n/);
        const sections = [];
        let current = null;
        for (const raw of lines) {
          const line = raw || '';
          const m = line.match(/^\s*(?:[#>*-]\s*)*(?:\*\*|__)?\s*(\d+[.)]\s*.+?)(?:\*\*|__)?\s*$/);
          if (m) {
            if (current) sections.push(current);
            current = { title: m[1].trim(), body: [] };
            continue;
          }
          if (!current) current = { title: '요약', body: [] };
          current.body.push(line);
        }
        if (current) sections.push(current);
        return sections.filter(sec => (sec.body.join('\n').trim() || sec.title));
      }

      const normalizedBaseText = normalizeOutputText(baseText);
      const fullText = normalizedBaseText || '';
      const sections = splitSections(fullText);
      if (sections.length > 1 || (sections[0] && sections[0].title !== '요약')) {
        html += '<div class="section-cards">' + sections.map((sec, idx) => {
          const bodyLines = (sec.body || []).join('\n').split('\n');
          let bodyHtml = '';
          for (let i = 0; i < bodyLines.length; i++) {
            const line = bodyLines[i];
            const trimmed = line.trim();
            if (!trimmed) continue;
            const isItem = /^[-·•]/.test(trimmed);
            bodyHtml += `<div class="section-line${isItem ? ' item' : ''}">${escapeHtml(line)}</div>`;
          }
          bodyHtml = bodyHtml || '-';
          return `
            <section class="section-card">
              <div class="section-card-head">
                <div class="section-card-title">${escapeHtml(sec.title || '섹션')}</div>
                <span class="line-tag">${idx + 1}</span>
              </div>
              <div class="section-card-body">${bodyHtml}</div>
            </section>
          `;
        }).join('') + '</div>';
      } else {
        html += '<div class="analysis-text">' + escapeHtml(fullText).replace(/\n{2,}/g, '\n').replace(/\n/g, '<br>') + '</div>';
      }

      html += `
        <div class="result-actions">
          <button type="button" class="btn-secondary" id="copyResultBtn">결과 복사</button>
        </div>
      `;

      showResult(html);

      const copyBtn = document.getElementById('copyResultBtn');
      if (copyBtn) {
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(fullText || '');
            copyBtn.textContent = '복사 완료';
            setTimeout(() => { copyBtn.textContent = '결과 복사'; }, 1200);
          } catch (e) {
            copyBtn.textContent = '복사 실패';
            setTimeout(() => { copyBtn.textContent = '결과 복사'; }, 1200);
          }
        });
      }
    }

    pledgeEl.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        btnEl.click();
      }
    });

    btnEl.addEventListener('click', async function () {
      const text = (pledgeEl.value || '').trim();
      if (!text) {
        showError('공약 내용이 입력되지 않았습니다. 내용을 작성해 주세요.');
        pledgeEl.focus();
        return;
      }

      showLoading();

      try {
        // /check, /api/pledge/verify 병렬 호출
        const checkPromise = fetch('/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pledge: text }),
          credentials: 'include'
        });
        const verifyPromise = fetch('/api/pledge/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, phase: 'quick' }),
          credentials: 'include'
        });

        const [checkRes, verifyRes] = await Promise.all([checkPromise, verifyPromise]);
        const [checkData, verifyData] = await Promise.all([
          checkRes.json().catch(() => ({})),
          verifyRes.json().catch(() => ({}))
        ]);

        // 기존 /check 상태 처리 유지
        if (!checkRes.ok) {
          if (checkRes.status === 401) { window.location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); return; }
          if (checkRes.status === 403) { window.location.href = '/pending'; return; }
          if (checkRes.status === 429) { showError((checkData.detail || '사용량을 모두 사용하셨습니다. 내일 또는 다음 달에 다시 이용해 주세요.') + '<br><a href="/dashboard" style="color:#ffb37a;">내 기록 확인</a>'); resetBtn(); return; }
          throw new Error(checkData.detail || checkRes.statusText || '서버 요청 실패');
        }

        // 기존 /verify 상태 처리 유지
        if (!verifyRes.ok) {
          if (verifyRes.status === 401) { window.location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); return; }
          if (verifyRes.status === 403) { window.location.href = '/pending'; return; }
          if (verifyRes.status === 429) { showError((verifyData.detail || '사용량을 모두 사용하셨습니다. 내일 또는 다음 달에 다시 이용해 주세요.') + '<br><a href="/dashboard" style="color:#ffb37a;">내 기록 확인</a>'); resetBtn(); return; }
          throw new Error(verifyData.detail || verifyRes.statusText || '서버 요청 실패');
        }

        const baseText = (checkData && typeof checkData.result === 'string') ? checkData.result : '';
        if (!verifyData || typeof verifyData !== 'object') throw new Error('분석 결과 형식이 올바르지 않습니다.');
        renderCombinedResult(baseText, verifyData);

      } catch (e) {
        console.error(e);
        const msg = (e && typeof e.message === 'string') ? e.message : '';
        if (msg.includes('로그인이 필요합니다')) {
          const next = encodeURIComponent(location.pathname + location.search);
          showError(
            '로그인이 필요합니다.<br>' +
            `<a href="/login?next=${next}" style="color:#ffb37a;font-weight:700;">로그인</a> · ` +
            '<a href="/signup" style="color:#ffb37a;font-weight:700;">회원가입</a>'
          );
        } else if (/Gateway|timeout|504|타임아웃/i.test(msg)) {
          showError(
            '분석 시간이 초과되었습니다.<br>' +
            '정책 분석에는 1~2분 걸릴 수 있습니다. 잠시 후 다시 시도해 주세요.<br>' +
            '<button type="button" class="btn-secondary" style="margin-top:0.75rem;" onclick="document.getElementById(\'btn\').click()">다시 시도</button><br>' +
            '<small>(' + (msg || 'Gateway Time-out') + ')</small>'
          );
        } else {
          showError(`분석 중 오류가 발생했습니다.<br>(${msg || '서버 연결 실패'})`);
        }
      } finally {
        resetBtn();
      }
    });

  </script>
</body>
</html>

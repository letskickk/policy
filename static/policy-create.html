<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정책 생성 - 개혁신당</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <style>
    /* Layout */
    .layout { display: grid; grid-template-columns: 340px 1fr; gap: 1.5rem; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    textarea { min-height: 60px; }
    .btn-generate { width: 100%; margin-top: 1rem; }

    /* Result */
    .result-area { white-space: pre-wrap; font-size: 0.9rem; line-height: 1.6; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 12px; min-height: 200px; max-height: 600px; overflow-y: auto; }
    .loading-spinner { color: #94a3b8; font-size: 0.9rem; }
    .err { color: #fca5a5; margin-top: 0.5rem; }

    /* Research panel */
    .research-item { padding: 0.4rem 0; border-bottom: 1px solid rgba(148,163,184,0.08); font-size: 0.85rem; }
    .research-item:last-child { border-bottom: none; }
    .tag { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; margin-right: 0.3rem; }
    .tag-blue { background: rgba(96,165,250,0.2); color: #93c5fd; }
    .tag-green { background: rgba(74,222,128,0.2); color: #86efac; }
    .tag-gray { background: rgba(148,163,184,0.15); color: #94a3b8; }

    /* Actions bar */
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    .actions .btn { width: auto; flex: 1; min-width: 120px; }

    /* Chatbot */
    .chat-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 1000; }
    .chat-toggle { width: 56px; height: 56px; border-radius: 50%; background: #ff7210; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
    .chat-toggle:hover { background: #e5650e; }
    .chat-box { display: none; width: 360px; max-height: 500px; background: rgba(7,48,83,0.97); border: 1px solid rgba(148,163,184,0.25); border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); margin-bottom: 0.75rem; overflow: hidden; }
    .chat-box.open { display: flex; flex-direction: column; }
    @media (max-width: 480px) { .chat-box { width: calc(100vw - 2rem); right: 0; } }
    .chat-header { padding: 0.75rem 1rem; background: rgba(255,255,255,0.06); font-weight: 700; font-size: 0.95rem; border-bottom: 1px solid rgba(148,163,184,0.15); display: flex; justify-content: space-between; align-items: center; }
    .chat-header button { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1.1rem; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 0.75rem 1rem; max-height: 340px; min-height: 200px; }
    .chat-msg { margin-bottom: 0.75rem; font-size: 0.85rem; line-height: 1.5; }
    .chat-msg.user { text-align: right; }
    .chat-msg .bubble { display: inline-block; padding: 0.5rem 0.75rem; border-radius: 12px; max-width: 85%; }
    .chat-msg.user .bubble { background: rgba(255,114,16,0.25); }
    .chat-msg.bot .bubble { background: rgba(255,255,255,0.08); }
    .chat-input { display: flex; gap: 0.5rem; padding: 0.75rem; border-top: 1px solid rgba(148,163,184,0.15); }
    .chat-input input { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(148,163,184,0.25); color: #e2e8f0; padding: 0.5rem; border-radius: 8px; font-size: 0.85rem; }
    .chat-input button { background: #ff7210; color: #fff; border: none; padding: 0.5rem 0.75rem; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="wrap-lg">
    <div class="links" style="margin-bottom:1rem;">
      <a href="/admin">← 관리자</a>
      <a href="/admin/issue-radar">이슈 레이더</a>
      <a href="/admin/policy-ssot">정책 SSOT</a>
    </div>
    <h1>정책 생성</h1>
    <p class="subtitle">주제와 지역을 입력하면 AI가 정책 초안을 생성합니다</p>

    <div class="layout">
      <!-- Left: Input form -->
      <div>
        <div class="card">
          <h2>입력</h2>
          <label>정책 주제</label>
          <input type="text" id="topic" placeholder="예: 청년 주거 안정">

          <label>출력 형식</label>
          <select id="outputFormat">
            <option value="정책포지션">정책 포지션</option>
            <option value="지역공약">지역 공약</option>
            <option value="입법취지서">입법 취지서</option>
          </select>

          <label>지역 (선택)</label>
          <input type="text" id="region" placeholder="예: 마포구">

          <label>선거유형 (선택)</label>
          <select id="electionType">
            <option value="">선택 안 함</option>
            <option value="광역단체장">광역단체장</option>
            <option value="기초단체장">기초단체장</option>
            <option value="광역의원">광역의원</option>
            <option value="기초의원">기초의원</option>
            <option value="교육감">교육감</option>
          </select>

          <button class="btn" id="generateBtn" onclick="generateDraft()">초안 생성</button>
        </div>

        <!-- Research panel -->
        <div class="card" id="researchPanel" style="display:none;">
          <h2>리서치 결과</h2>
          <div id="researchContent"></div>
        </div>
      </div>

      <!-- Right: Output -->
      <div>
        <div class="card">
          <h2>생성된 초안</h2>
          <p class="loading-spinner" id="loadingMsg" style="display:none;">초안을 생성하고 있습니다...</p>
          <p class="err" id="errMsg" style="display:none;"></p>
          <div class="result-area" id="resultArea">주제를 입력하고 "초안 생성" 버튼을 누르세요.</div>

          <div class="actions" id="actionBar" style="display:none;">
            <button class="btn btn-green" onclick="saveDraft()">초안 저장 (draft)</button>
            <button class="btn btn-secondary" onclick="copyDraft()">복사</button>
            <button class="btn btn-secondary" onclick="generateDraft()">재생성</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Chatbot widget -->
  <div class="chat-container">
    <div class="chat-box" id="chatBox">
      <div class="chat-header">
        <span>정책 챗봇</span>
        <button onclick="toggleChat()">X</button>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-msg bot"><div class="bubble">안녕하세요! 개혁신당 정책에 대해 궁금한 점을 물어보세요.</div></div>
      </div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="질문을 입력하세요" onkeydown="if(event.key==='Enter')sendChat()">
        <button onclick="sendChat()">전송</button>
      </div>
    </div>
    <button class="chat-toggle" onclick="toggleChat()" title="정책 챗봇">?</button>
  </div>

  <script>
    function escapeHtml(s) {
      return String(s ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    }

    let _lastDraftText = '';
    let _lastResearch = null;

    // Phase 5: URL 파라미터로 폼 프리필 (출마자 셀프서비스)
    (function prefillFromUrl() {
      const p = new URLSearchParams(location.search);
      if (p.get('format')) {
        const fmt = document.getElementById('outputFormat');
        if (fmt) { for (const opt of fmt.options) { if (opt.value === p.get('format')) { fmt.value = p.get('format'); break; } } }
      }
      if (p.get('election_type')) {
        const el = document.getElementById('electionType');
        if (el) { for (const opt of el.options) { if (opt.value === p.get('election_type')) { el.value = p.get('election_type'); break; } } }
      }
      if (p.get('region')) { const el = document.getElementById('region'); if (el) el.value = p.get('region'); }
      if (p.get('district')) { const el = document.getElementById('district'); if (el) el.value = p.get('district'); }
      if (p.get('topic')) { const el = document.getElementById('topic'); if (el) el.value = p.get('topic'); }
    })();

    async function generateDraft() {
      const topic = document.getElementById('topic').value.trim();
      if (!topic) { alert('정책 주제를 입력하세요.'); return; }

      const btn = document.getElementById('generateBtn');
      const loadingEl = document.getElementById('loadingMsg');
      const errEl = document.getElementById('errMsg');
      const resultEl = document.getElementById('resultArea');
      const actionBar = document.getElementById('actionBar');

      btn.disabled = true;
      loadingEl.style.display = 'block';
      errEl.style.display = 'none';
      actionBar.style.display = 'none';
      resultEl.textContent = '';

      try {
        const body = {
          topic: topic,
          output_format: document.getElementById('outputFormat').value,
          region: document.getElementById('region').value.trim() || null,
          election_type: document.getElementById('electionType').value,
          region_province: document.getElementById('region').value.trim(),
        };

        const r = await fetch('/api/policy/draft', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(body),
        });

        if (r.status === 401) { window.location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
        if (!r.ok) { throw new Error('서버 오류 (' + r.status + ')'); }

        const data = await r.json();

        if (data.error) {
          errEl.textContent = data.draft_text || '오류가 발생했습니다.';
          errEl.style.display = 'block';
          return;
        }

        _lastDraftText = data.draft_text;
        _lastResearch = data.research;
        resultEl.textContent = data.draft_text;
        actionBar.style.display = 'flex';

        // Show research panel
        if (data.research && data.research.ssot) {
          renderResearch(data.research);
        }
      } catch (e) {
        errEl.textContent = '오류: ' + (e.message || String(e));
        errEl.style.display = 'block';
      } finally {
        loadingEl.style.display = 'none';
        btn.disabled = false;
      }
    }

    function renderResearch(research) {
      const panel = document.getElementById('researchPanel');
      const content = document.getElementById('researchContent');
      let html = '';

      html += '<h3>분류: ' + escapeHtml(research.classified_topic) + '</h3>';

      // Positions
      const positions = (research.ssot || {}).related_positions || [];
      if (positions.length > 0) {
        html += '<h3>기존 포지션 ' + positions.length + '건</h3>';
        for (const p of positions) {
          html += '<div class="research-item"><span class="tag tag-green">포지션</span>' + escapeHtml(p.title) + '</div>';
        }
      } else {
        html += '<div class="research-item" style="color:#fca5a5;">관련 포지션 없음 (정책 사각지대)</div>';
      }

      // Documents
      const docs = (research.ssot || {}).related_documents || [];
      if (docs.length > 0) {
        html += '<h3>관련 문서 ' + docs.length + '건</h3>';
        for (const d of docs.slice(0, 8)) {
          html += '<div class="research-item"><span class="tag tag-blue">' + escapeHtml(d.doc_type) + '</span>' + escapeHtml(d.title) + '</div>';
        }
      }

      // Assembly
      if (research.assembly) {
        html += '<h3>지방의회</h3>';
        html += '<div class="research-item"><span class="tag tag-gray">' +
          (research.assembly.available ? research.assembly.result_count + '건' : '미연동') +
          '</span>' + (research.assembly.available ? '데이터 확인됨' : 'API 키 미설정') + '</div>';
      }

      content.innerHTML = html;
      panel.style.display = 'block';
    }

    async function saveDraft() {
      if (!_lastDraftText) { alert('저장할 초안이 없습니다.'); return; }

      const title = prompt('정책 제목을 입력하세요:', document.getElementById('topic').value);
      if (!title) return;

      try {
        const r = await fetch('/api/policy/draft/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            title: title,
            summary: _lastDraftText.substring(0, 500),
            key_points: '',
            body: _lastDraftText,
            category: (_lastResearch || {}).classified_topic || 'general',
          }),
        });

        if (!r.ok) throw new Error('저장 실패');
        const data = await r.json();
        alert('초안이 저장되었습니다. (ID: ' + data.position_id + ')\n정책 SSOT에서 확인할 수 있습니다.');
      } catch (e) {
        alert('저장 오류: ' + (e.message || String(e)));
      }
    }

    function copyDraft() {
      if (_lastDraftText) {
        navigator.clipboard.writeText(_lastDraftText).then(() => alert('복사되었습니다.'));
      }
    }

    // ── Chatbot ──
    function toggleChat() {
      document.getElementById('chatBox').classList.toggle('open');
    }

    async function sendChat() {
      const input = document.getElementById('chatInput');
      const q = input.value.trim();
      if (!q) return;
      input.value = '';

      const messages = document.getElementById('chatMessages');
      messages.innerHTML += '<div class="chat-msg user"><div class="bubble">' + escapeHtml(q) + '</div></div>';
      messages.scrollTop = messages.scrollHeight;

      try {
        const r = await fetch('/api/policy/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ question: q }),
        });
        const data = await r.json();
        const answer = data.answer || '답변을 생성하지 못했습니다.';
        messages.innerHTML += '<div class="chat-msg bot"><div class="bubble">' + escapeHtml(answer) + '</div></div>';
      } catch (e) {
        messages.innerHTML += '<div class="chat-msg bot"><div class="bubble" style="color:#fca5a5;">오류가 발생했습니다.</div></div>';
      }
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>

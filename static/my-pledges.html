<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 공약 등록 - 정책 멘토링</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: linear-gradient(160deg, #04162b 0%, #073053 55%, #0a3b69 100%);
      min-height: 100vh; color: #e2e8f0; padding: 2rem;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .top-bar .brand { display: inline-flex; align-items: center; gap: 0.75rem; }
    .top-bar .brand-logo {
      display: inline-flex; align-items: center; gap: 0.75rem;
      text-decoration: none; color: inherit; line-height: 1; margin: 0;
    }
    .top-bar .brand-logo:hover { color: inherit; opacity: 0.95; }
    .top-bar .brand-logo img {
      height: 30px; width: auto; display: inline-block;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.25));
    }
    .top-bar .brand-title {
      font-size: 1.05rem; font-weight: 900; letter-spacing: -0.02em; color: #f8fafc;
    }
    .top-bar .brand-tag {
      display: block; margin-top: 0.35rem; font-size: 0.84rem;
      color: #ffb37a; letter-spacing: -0.01em; font-weight: 800; opacity: 0.95;
    }
    .top-bar .nav { margin: 0; padding: 0; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #f8fafc; word-break: keep-all; }
    .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.2rem; word-break: keep-all; }
    .nav-link {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 36px; padding: 0 0.9rem;
      color: #e2e8f0; text-decoration: none;
      font-size: 0.875rem; font-weight: 700;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(148,163,184,0.18);
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .nav-link:hover { background: rgba(255,255,255,0.10); color: #f8fafc; border-color: rgba(148,163,184,0.28); }
    .footer { margin-top: 2rem; padding-top: 1rem; text-align: center; font-size: 0.9rem; color: #94a3b8; line-height: 1.8; border-top: 1px solid rgba(148,163,184,0.18); }
    .footer a { color: #ffb37a; text-decoration: none; font-weight: 700; }
    .footer a:hover { text-decoration: underline; }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 18px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .info-grid { display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 1rem; margin-bottom: 1.2rem; }
    .info-grid .lbl { font-weight: 700; font-size: 0.85rem; color: #94a3b8; }
    .info-grid .val { font-size: 0.95rem; color: #fff; }
    label { display: block; font-weight: 700; margin-bottom: 0.35rem; font-size: 0.9rem; }
    .pledge-block {
      background: rgba(0,0,0,0.15);
      border: 1px solid rgba(148,163,184,0.15);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      position: relative;
    }
    .pledge-block .pledge-header { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
    .pledge-block .pledge-header input[type="text"] { flex: 1; margin-bottom: 0; }
    .pledge-block .pledge-header input[type="number"] { width: 60px; margin-bottom: 0; }
    .pledge-block .pledge-num {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
      background: rgba(255,114,16,0.25); color: #ffb37a; font-weight: 900; font-size: 0.85rem;
      display: flex; align-items: center; justify-content: center;
    }
    .pledge-block textarea { margin-bottom: 0; }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border-radius: 10px;
      border: 1px solid rgba(148,163,184,0.28);
      background: rgba(0,0,0,0.22);
      color: #fff;
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border-radius: 10px;
      border: 1px solid rgba(148,163,184,0.28);
      background: rgba(0,0,0,0.22);
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 80px;
    }
    button {
      padding: 0.5rem 1rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .btn-add { background: #22c55e; color: #fff; margin-bottom: 1rem; }
    .btn-submit { background: #ff7210; color: #fff; width: 100%; padding: 0.75rem; font-size: 1rem; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-remove { background: transparent; color: #94a3b8; padding: 0.25rem 0.5rem; font-size: 0.85rem; }
    .btn-remove:hover { color: #ef4444; }
    .btn-delete-all { background: rgba(239,68,68,0.15); color: #fca5a5; margin-top: 0.75rem; }
    .btn-delete-all:hover { background: rgba(239,68,68,0.3); }
    #msg { margin-top: 1rem; padding: 0.75rem; border-radius: 10px; display: none; }
    .muted { color: #94a3b8; font-size: 0.85rem; }
    .empty-state { text-align: center; padding: 2rem 0; color: #64748b; }
    .badge {
      display: inline-block; padding: 0.15rem 0.55rem; border-radius: 6px;
      font-size: 0.8rem; font-weight: 700;
    }
    .badge-new { background: rgba(34,197,94,0.2); color: #86efac; }
    .badge-edit { background: rgba(56,189,248,0.2); color: #7dd3fc; }
    .badge-pending { background: rgba(250,204,21,0.2); color: #fde047; }
    .badge-approved { background: rgba(34,197,94,0.2); color: #86efac; }
    .badge-rejected { background: rgba(239,68,68,0.2); color: #fca5a5; }
    .approval-info {
      margin-top: 0.6rem;
      padding: 0.6rem 0.8rem;
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .approval-info.pending { background: rgba(250,204,21,0.08); border: 1px solid rgba(250,204,21,0.2); color: #fde047; }
    .approval-info.approved { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); color: #86efac; }
    .approval-info.rejected { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); color: #fca5a5; }
    .char-count { text-align: right; font-size: 0.75rem; color: #64748b; margin-top: 0.2rem; }
    .char-count.warn { color: #fde047; }
    .char-count.over { color: #fca5a5; }
    .loading { text-align: center; padding: 2rem; color: #64748b; }
    @media (max-width: 560px) {
      body { padding: 1rem; }
      .wrap { padding: 0 0.5rem; }
      .top-bar { flex-direction: column; align-items: stretch; }
      .top-bar .brand-tag { display: none; }
      .nav-link { min-height: 32px; padding: 0 0.75rem; font-size: 0.85rem; }
      .info-grid { grid-template-columns: 1fr; gap: 0.15rem; }
      .info-grid .lbl { margin-top: 0.3rem; }
      .card { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <div class="brand">
        <a href="/" class="brand-logo">
          <img src="/static/logo.svg" alt="개혁신당 로고">
          <span class="brand-inner">
            <span class="brand-title">개혁신당 정책 멘토링</span>
            <span class="brand-tag">공약 점검 + 지역/선거구 후보 공약 비교</span>
          </span>
        </a>
      </div>
      <nav class="nav">
        <a href="/dashboard" class="nav-link">내 기록</a>
        <a href="/pledge" class="nav-link">공약 분석</a>
        <a href="/map" class="nav-link">지역 공약</a>
      </nav>
    </div>
    <h1>내 공약 등록</h1>
    <p class="subtitle">회원가입 시 선택한 지역·선거 유형에 맞는 공약을 등록하세요. 관리자 승인 후 지도 페이지에 공개됩니다.</p>

    <div id="loading" class="loading">불러오는 중...</div>

    <div id="no-position" style="display:none;" class="card">
      <div class="empty-state">
        <p>회원가입 시 출마 유형과 지역을 선택하지 않아<br>공약 등록이 불가합니다.</p>
        <p class="muted" style="margin-top:0.5rem;">관리자에게 문의하거나 재가입 해주세요.</p>
      </div>
    </div>

    <div id="main-content" style="display:none;">
      <div class="card">
        <div class="info-grid" id="user-info"></div>
        <span id="status-badge"></span>
        <div id="approval-info"></div>
      </div>

      <div class="card">
        <form id="form">
          <label>공약 목록</label>
          <div id="pledges_container"></div>
          <button type="button" class="btn-add" id="add_pledge">+ 공약 추가</button>
          <button type="submit" class="btn-submit" id="submit_btn">저장</button>
        </form>
        <div id="msg"></div>
        <div style="text-align:right;">
          <button type="button" class="btn-delete-all" id="delete_all_btn" style="display:none;">후보 등록 전체 삭제</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ELECTION_TYPE_LABELS = {
      metro_mayor: '광역단체장',
      regional_council: '광역의원',
      local_mayor: '기초단체장',
      local_council: '기초의원',
      party_official: '당직자',
    };

    const loadingEl = document.getElementById('loading');
    const noPosEl = document.getElementById('no-position');
    const mainEl = document.getElementById('main-content');
    const userInfoEl = document.getElementById('user-info');
    const statusBadgeEl = document.getElementById('status-badge');
    const form = document.getElementById('form');
    const msgEl = document.getElementById('msg');
    const pledgesContainer = document.getElementById('pledges_container');
    const deleteAllBtn = document.getElementById('delete_all_btn');
    const submitBtn = document.getElementById('submit_btn');

    let pledgeIndex = 0;
    let hasExistingCandidate = false;

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function addPledgeRow(title = '', content = '', priority = '') {
      pledgeIndex++;
      const id = 'p' + pledgeIndex;
      const div = document.createElement('div');
      div.className = 'pledge-block';
      div.id = id;
      const titleLen = (title || '').length;
      const contentLen = (content || '').length;
      div.innerHTML = `
        <div class="pledge-header">
          <span class="pledge-num">${pledgeIndex}</span>
          <input type="text" name="pledge_title" placeholder="공약 제목 (최대 100자)" value="${esc(title)}" maxlength="100" required />
          <input type="number" name="pledge_priority" placeholder="순서" value="${esc(priority || pledgeIndex)}" min="1" max="9999" style="width:60px;" />
          <button type="button" class="btn-remove" data-remove="${id}">삭제</button>
        </div>
        <div class="char-count title-count">${titleLen}/100</div>
        <textarea name="pledge_content" placeholder="공약 세부내용 (배경, 실행방안, 기대효과 등)" rows="4" maxlength="50000">${esc(content)}</textarea>
        <div class="char-count content-count">${contentLen}/50,000</div>
      `;
      pledgesContainer.appendChild(div);
      const titleInput = div.querySelector('input[name="pledge_title"]');
      const titleCounter = div.querySelector('.title-count');
      const contentInput = div.querySelector('textarea[name="pledge_content"]');
      const contentCounter = div.querySelector('.content-count');
      titleInput.addEventListener('input', () => updateCounter(titleInput, titleCounter, 100));
      contentInput.addEventListener('input', () => updateCounter(contentInput, contentCounter, 50000));
      div.querySelector('[data-remove]').addEventListener('click', () => {
        div.remove();
        renumberPledges();
      });
    }

    function renumberPledges() {
      const blocks = pledgesContainer.querySelectorAll('.pledge-block');
      blocks.forEach((block, i) => {
        const num = block.querySelector('.pledge-num');
        if (num) num.textContent = i + 1;
      });
    }

    function updateCounter(input, counter, max) {
      const len = input.value.length;
      const formatted = max >= 10000 ? max.toLocaleString() : max;
      counter.textContent = `${len.toLocaleString()}/${formatted}`;
      counter.className = 'char-count' + (len >= max ? ' over' : len >= max * 0.9 ? ' warn' : '');
    }

    document.getElementById('add_pledge').addEventListener('click', () => addPledgeRow());

    function showMsg(text, ok) {
      msgEl.textContent = text;
      msgEl.style.display = 'block';
      msgEl.style.background = ok ? 'rgba(34,197,94,0.2)' : 'rgba(239,68,68,0.2)';
      msgEl.style.color = ok ? '#86efac' : '#fca5a5';
    }

    async function loadData() {
      try {
        const res = await fetch('/api/my/candidate', { credentials: 'include' });
        if (res.status === 401) { location.href = '/login?next=/my-pledges'; return; }
        if (res.status === 403) { location.href = '/pending'; return; }
        if (!res.ok) { showMsg('데이터를 불러올 수 없습니다.', false); return; }
        const data = await res.json();
        const ui = data.user_info || {};

        if (ui.election_position === 'party_official') {
          loadingEl.style.display = 'none';
          noPosEl.querySelector('p').innerHTML = '당직자 유형으로 가입되어<br>공약 등록 대상이 아닙니다.';
          noPosEl.style.display = 'block';
          return;
        }
        if (!ui.election_position || !ui.region_code) {
          loadingEl.style.display = 'none';
          noPosEl.style.display = 'block';
          return;
        }

        const typeLabel = ELECTION_TYPE_LABELS[ui.election_type] || ui.election_type || '';
        const regionLabel = ui.region_name || ui.region_code || '';
        const districtLabel = ui.district_name || '';

        let infoHtml = '';
        infoHtml += `<span class="lbl">이름</span><span class="val">${esc(ui.name)}</span>`;
        infoHtml += `<span class="lbl">선거 유형</span><span class="val">${esc(typeLabel)}</span>`;
        infoHtml += `<span class="lbl">지역</span><span class="val">${esc(regionLabel)}</span>`;
        if (districtLabel && ui.election_type !== 'metro_mayor') {
          infoHtml += `<span class="lbl">선거구</span><span class="val">${esc(districtLabel)}</span>`;
        }
        userInfoEl.innerHTML = infoHtml;

        const approvalInfoEl = document.getElementById('approval-info');
        if (data.candidate) {
          hasExistingCandidate = true;
          statusBadgeEl.innerHTML = '<span class="badge badge-edit">수정 모드 - 기존 공약이 있습니다</span>';
          submitBtn.textContent = '공약 수정 저장';
          deleteAllBtn.style.display = 'inline-block';

          const status = (data.candidate.approval_status || 'PENDING').toUpperCase();
          if (status === 'APPROVED') {
            statusBadgeEl.innerHTML += ' <span class="badge badge-approved">승인됨</span>';
            approvalInfoEl.innerHTML = '<div class="approval-info approved">공약이 승인되어 지도에 공개 중입니다. 수정 시 재승인이 필요합니다.</div>';
          } else if (status === 'REJECTED') {
            statusBadgeEl.innerHTML += ' <span class="badge badge-rejected">거절됨</span>';
            approvalInfoEl.innerHTML = '<div class="approval-info rejected">공약이 거절되었습니다. 수정 후 다시 저장하면 재심사 요청됩니다.</div>';
          } else {
            statusBadgeEl.innerHTML += ' <span class="badge badge-pending">승인 대기</span>';
            approvalInfoEl.innerHTML = '<div class="approval-info pending">관리자 승인 대기 중입니다. 승인 후 지도에 공개됩니다.</div>';
          }

          const pledges = data.pledges || [];
          if (pledges.length === 0) {
            addPledgeRow();
          } else {
            pledges.forEach(p => addPledgeRow(p.title, p.content || '', p.priority));
          }
        } else {
          statusBadgeEl.innerHTML = '<span class="badge badge-new">신규 등록</span>';
          approvalInfoEl.innerHTML = '<div class="approval-info pending">공약 등록 후 관리자 승인을 거쳐 지도에 공개됩니다.</div>';
          submitBtn.textContent = '공약 등록';
          addPledgeRow();
        }

        loadingEl.style.display = 'none';
        mainEl.style.display = 'block';
      } catch (e) {
        console.error(e);
        loadingEl.textContent = '데이터를 불러올 수 없습니다.';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgEl.style.display = 'none';
      submitBtn.disabled = true;

      const blocks = pledgesContainer.querySelectorAll('.pledge-block');
      const pledges = [];
      let hasEmpty = false;
      blocks.forEach((block, idx) => {
        const title = (block.querySelector('input[name="pledge_title"]').value || '').trim();
        if (!title) { hasEmpty = true; return; }
        const content = (block.querySelector('textarea[name="pledge_content"]').value || '').trim();
        const priority = parseInt(block.querySelector('input[name="pledge_priority"]').value, 10) || (idx + 1);
        pledges.push({ title, content: content || null, priority });
      });

      if (pledges.length === 0) {
        showMsg('최소 1개 이상의 공약 제목을 입력하세요.', false);
        submitBtn.disabled = false;
        return;
      }

      try {
        const res = await fetch('/api/my/candidate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ pledges }),
        });
        const text = await res.text();
        let data = {};
        try { data = JSON.parse(text); } catch (_) {}
        if (!res.ok) {
          let errMsg = '저장 실패 (' + res.status + ')';
          if (data.detail) {
            if (typeof data.detail === 'string') errMsg = data.detail;
            else if (Array.isArray(data.detail)) errMsg = data.detail.map(e => e.msg || JSON.stringify(e)).join(', ');
            else errMsg = JSON.stringify(data.detail);
          }
          showMsg(errMsg, false);
          console.error('Save error:', res.status, data);
          submitBtn.disabled = false;
          return;
        }
        showMsg(`공약 ${data.pledge_count || pledges.length}개가 저장되었습니다. 관리자 승인 후 지도에 공개됩니다.`, true);
        hasExistingCandidate = true;
        statusBadgeEl.innerHTML = '<span class="badge badge-edit">수정 모드</span> <span class="badge badge-pending">승인 대기</span>';
        const aInfoEl = document.getElementById('approval-info');
        if (aInfoEl) aInfoEl.innerHTML = '<div class="approval-info pending">관리자 승인 대기 중입니다. 승인 후 지도에 공개됩니다.</div>';
        submitBtn.textContent = '공약 수정 저장';
        deleteAllBtn.style.display = 'inline-block';
      } catch (err) {
        showMsg('서버 연결 실패', false);
      }
      submitBtn.disabled = false;
    });

    deleteAllBtn.addEventListener('click', async () => {
      if (!confirm('등록된 후보 정보와 공약이 모두 삭제됩니다. 계속하시겠습니까?')) return;
      try {
        const res = await fetch('/api/my/candidate', { method: 'DELETE', credentials: 'include' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { showMsg(data.detail || '삭제 실패', false); return; }
        showMsg('삭제되었습니다.', true);
        hasExistingCandidate = false;
        statusBadgeEl.innerHTML = '<span class="badge badge-new">신규 등록</span>';
        submitBtn.textContent = '공약 등록';
        deleteAllBtn.style.display = 'none';
        pledgesContainer.innerHTML = '';
        pledgeIndex = 0;
        addPledgeRow();
      } catch (err) { showMsg('서버 연결 실패', false); }
    });

    loadData();
  </script>
  <p class="footer">
    <strong>개혁신당 정책국</strong><br>
    문의: <a href="mailto:letskick@reformparty.kr">letskick@reformparty.kr</a>
  </p>
</body>
</html>

      toggle.addEventListener('click', () => {

        toggle.textContent = isCollapsed ? '遺꾩꽍 寃곌낵 ?붾낫湲??? : '?묎린 ??;
      });
    }

    function renumberPledges() {
      pledgesContainer.querySelectorAll('.pledge-block').forEach((block, i) => {
        const num = block.querySelector('.pledge-num');
        if (num) num.textContent = i + 1;
      });
    }

    function updateCounter(input, counter, max) {
      const len = input.value.length;
      const formatted = max >= 10000 ? max.toLocaleString() : max;
      counter.textContent = `${len.toLocaleString()}/${formatted}`;
      counter.className = 'char-count' + (len >= max ? ' over' : len >= max * 0.9 ? ' warn' : '');
    }

    document.getElementById('add_pledge').addEventListener('click', () => addPledgeRow());

    function showMsg(text, ok) {
      msgEl.textContent = text;
      msgEl.style.display = 'block';
      msgEl.style.background = ok ? 'rgba(34,197,94,0.15)' : 'rgba(239,68,68,0.15)';
      msgEl.style.color = ok ? '#86efac' : '#fca5a5';
    }

    // ?? ?곗씠??濡쒕뱶 ??
    async function loadData() {
      try {
        const res = await fetch('/api/my/candidate', { credentials: 'include' });
        if (res.status === 401) { location.href = '/login?next=/my-pledges'; return; }
        if (res.status === 403) { location.href = '/pending'; return; }
        if (!res.ok) { showMsg('?곗씠?곕? 遺덈윭?????놁뒿?덈떎.', false); return; }
        const data = await res.json();
        const ui = data.user_info || {};

        if (ui.election_position === 'party_official') {
          loadingEl.style.display = 'none';
          noPosEl.querySelector('p').innerHTML = '?뱀쭅???좏삎?쇰줈 媛?낅릺??br>怨듭빟 ?깅줉 ??곸씠 ?꾨떃?덈떎.';
          noPosEl.style.display = 'block'; return;
        }
        if (!ui.election_position || !ui.region_code) {
          loadingEl.style.display = 'none'; noPosEl.style.display = 'block'; return;
        }

        let infoHtml = '';
        infoHtml += `<span class="lbl">?대쫫</span><span class="val">${esc(ui.name)}</span>`;
        infoHtml += `<span class="lbl">?좉굅 ?좏삎</span><span class="val">${esc(ELECTION_TYPE_LABELS[ui.election_type] || ui.election_type || '')}</span>`;
        infoHtml += `<span class="lbl">吏??/span><span class="val">${esc(ui.region_name || ui.region_code || '')}</span>`;
        if (ui.district_name && ui.election_type !== 'metro_mayor') {
          infoHtml += `<span class="lbl">?좉굅援?/span><span class="val">${esc(ui.district_name)}</span>`;
        }
        userInfoEl.innerHTML = infoHtml;

        const approvalInfoEl = document.getElementById('approval-info');
        if (data.candidate) {
          hasExistingCandidate = true;
          statusBadgeEl.innerHTML = '<span class="badge badge-edit">?섏젙 紐⑤뱶</span>';
          submitBtn.textContent = '怨듭빟 ?섏젙 ???;

          const status = (data.candidate.approval_status || 'PENDING').toUpperCase();
          if (status === 'APPROVED') {
            statusBadgeEl.innerHTML += ' <span class="badge badge-approved">?뱀씤??/span>';
            approvalInfoEl.innerHTML = '<div class="approval-info approved">怨듭빟???뱀씤?섏뼱 吏?꾩뿉 怨듦컻 以묒엯?덈떎. ?섏젙 ???ъ듅?몄씠 ?꾩슂?⑸땲??</div>';
          } else if (status === 'REJECTED') {
            statusBadgeEl.innerHTML += ' <span class="badge badge-rejected">嫄곗젅??/span>';
            const rejReason = data.candidate.rejection_reason || '';
            const rejReasonHtml = rejReason
              ? `<div style="margin-top:0.5rem;padding:0.5rem 0.7rem;background:rgba(239,68,68,0.08);border-radius:8px;font-size:0.88rem;color:#fca5a5;line-height:1.5;"><strong style="color:#f87171;">嫄곗젅 ?ъ쑀:</strong> ${esc(rejReason)}</div>`
              : '';
            approvalInfoEl.innerHTML = '<div class="approval-info rejected">怨듭빟??嫄곗젅?섏뿀?듬땲?? ?섏젙 ???ㅼ떆 ??ν븯硫??ъ떖???붿껌?⑸땲??</div>' + rejReasonHtml;
          } else {
            statusBadgeEl.innerHTML += ' <span class="badge badge-pending">?뱀씤 ?湲?/span>';
            approvalInfoEl.innerHTML = '<div class="approval-info pending">愿由ъ옄 ?뱀씤 ?湲?以묒엯?덈떎. ?뱀씤 ??吏?꾩뿉 怨듦컻?⑸땲??</div>';
          }

          const pledges = data.pledges || [];
          pledges.forEach(p => addPledgeRow(p.title, p.content || '', p.priority, p.id, p.total_score, p.analyzed_at, p.analysis_result));
        } else {
          statusBadgeEl.innerHTML = '<span class="badge badge-new">?좉퇋 ?깅줉</span>';
          approvalInfoEl.innerHTML = '<div class="approval-info pending">怨듭빟 ?깅줉 ??愿由ъ옄 ?뱀씤??嫄곗퀜 吏?꾩뿉 怨듦컻?⑸땲??</div>';
          submitBtn.textContent = '怨듭빟 ?깅줉';
        }

        loadingEl.style.display = 'none';
        mainEl.style.display = 'block';
      } catch (e) {
        console.error(e);
        loadingEl.textContent = '?곗씠?곕? 遺덈윭?????놁뒿?덈떎.';
      }
    }

    // ?? ?????
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgEl.style.display = 'none';
      submitBtn.disabled = true;

      const blocks = pledgesContainer.querySelectorAll('.pledge-block');
      const pledges = [];
      blocks.forEach((block, idx) => {
        const title = (block.querySelector('input[name="pledge_title"]').value || '').trim();
        if (!title) return;
        const content = (block.querySelector('textarea[name="pledge_content"]').value || '').trim();
        const priority = parseInt(block.querySelector('input[name="pledge_priority"]')?.value, 10) || (idx + 1);
        const pledge = { title, content: content || null, priority };
        // 湲곗〈 怨듭빟 ID ?꾨떖 (??젣-?꾩슜 ?먮퀎??
        if (block.dataset.pledgeId) pledge.pledge_id = parseInt(block.dataset.pledgeId, 10);
        // ?먯닔 蹂댁〈
        if (block.dataset.savedScore !== undefined && block.dataset.savedScore !== '') {
          const s = parseFloat(block.dataset.savedScore);
          pledge.imported_score = isNaN(s) ? null : s;
          pledge.imported_result = block.dataset.savedResult || null;
          pledge.imported_analyzed_at = block.dataset.savedAnalyzedAt || null;
        }
        pledges.push(pledge);
      });

      if (pledges.length === 0) {
        showMsg('理쒖냼 1媛??댁긽??怨듭빟 ?쒕ぉ???낅젰?섏꽭??', false);
        submitBtn.disabled = false; return;
      }

      // 遺꾩꽍 ????怨듭빟 李⑤떒
      const unanalyzed = pledges.filter(p => p.imported_score == null);
      if (unanalyzed.length > 0) {
        showMsg(`遺꾩꽍?섏? ?딆? 怨듭빟??${unanalyzed.length}媛??덉뒿?덈떎. 紐⑤뱺 怨듭빟? [遺꾩꽍 湲곕줉?먯꽌 遺덈윭?ㅺ린]濡??깅줉?댁빞 ?⑸땲??`, false);
        submitBtn.disabled = false; return;
      }

      try {
        const res = await fetch('/api/my/candidate', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          credentials: 'include', body: JSON.stringify({ pledges }),
        });
        const text = await res.text();
        let data = {}; try { data = JSON.parse(text); } catch (_) {}
        if (!res.ok) {
          let errMsg = '????ㅽ뙣 (' + res.status + ')';
          if (data.detail) {
            if (typeof data.detail === 'string') errMsg = data.detail;
            else if (Array.isArray(data.detail)) errMsg = data.detail.map(e => e.msg || JSON.stringify(e)).join(', ');
            else errMsg = JSON.stringify(data.detail);
          }
          showMsg(errMsg, false);
          submitBtn.disabled = false; return;
        }
        showMsg(`怨듭빟 ${data.pledge_count || pledges.length}媛쒓? ??λ릺?덉뒿?덈떎. 愿由ъ옄 ?뱀씤 ??吏?꾩뿉 怨듦컻?⑸땲??`, true);
        pledgesContainer.innerHTML = '';
        pledgeIndex = 0;
        await loadData();
      } catch (err) { showMsg('?쒕쾭 ?곌껐 ?ㅽ뙣', false); }
      submitBtn.disabled = false;
    });

    // ?? 遺덈윭?ㅺ린 紐⑤떖 ??
    const importModal = document.getElementById('importModal');
    const importModalBody = document.getElementById('importModalBody');
    document.getElementById('importModalClose').addEventListener('click', () => importModal.classList.add('hidden'));
    importModal.addEventListener('click', (e) => { if (e.target === importModal) importModal.classList.add('hidden'); });

    function openImportModal(targetBlock) {
      importTargetBlock = targetBlock || null;
      importModal.classList.remove('hidden');
      importModalBody.innerHTML = '<div class="modal-empty">遺덈윭?ㅻ뒗 以?..</div>';
      fetch('/api/history?limit=50', { credentials: 'include' })
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(data => {
          const items = (data.items || []).filter(it => it.status_code === 200);
          if (items.length === 0) {
            importModalBody.innerHTML = '<div class="modal-empty">遺꾩꽍 湲곕줉???놁뒿?덈떎.<br><a href="/pledge" style="color:#93c5fd;">怨듭빟 遺꾩꽍 ?섏씠吏</a>?먯꽌 癒쇱? 遺꾩꽍??二쇱꽭??</div>';
            return;
          }
          importModalBody.innerHTML = '';
          items.forEach(it => {
            const scoreText = it.total_score != null ? `${it.total_score}?? : '?먯닔 ?놁쓬';
            const scoreColor = it.total_score != null ? scoreClass(it.total_score) : '';
            // UTC ??KST 蹂??
            const rawDate = it.created_at || '';
            let dateText = rawDate.slice(0, 16).replace('T', ' ');
            try {
              const utc = new Date(rawDate.endsWith('Z') ? rawDate : rawDate + 'Z');
              if (!isNaN(utc)) dateText = utc.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).replace(/\./g, '-').replace(/\s+/g, ' ');
            } catch (_) {}
            // 泥?以꾩쓣 ?쒕ぉ?쇰줈 ?쒖떆, ?섎㉧吏???댁슜 誘몃━蹂닿린
            const preview = it.input_preview || '';
            const nlIdx = preview.indexOf('\n');
            const title = nlIdx > 0 ? preview.slice(0, nlIdx).trim() : preview.trim();
            const body = nlIdx > 0 ? preview.slice(nlIdx + 1).trim() : '';
            const el = document.createElement('div');
            el.className = 'history-item';
            el.innerHTML = `
              <div class="hi-top">
                <span class="hi-score score-badge ${scoreColor}">${esc(scoreText)}</span>
                <span class="hi-date">${esc(dateText)}</span>
              </div>
              <div style="font-size:0.88rem;color:#e2e8f0;font-weight:700;margin-bottom:0.15rem;">${esc(title)}</div>
              ${body ? `<div class="hi-preview">${esc(body)}</div>` : ''}
            `;
            el.addEventListener('click', () => importFromHistory(it.id));
            importModalBody.appendChild(el);
          });
        })
        .catch(() => { importModalBody.innerHTML = '<div class="modal-empty">?ㅻ쪟媛 諛쒖깮?덉뒿?덈떎.</div>'; });
    }

    async function importFromHistory(historyId) {
      try {
        const res = await fetch(`/api/history/${historyId}`, { credentials: 'include' });
        if (!res.ok) { alert('湲곕줉??遺덈윭?????놁뒿?덈떎.'); return; }
        const item = await res.json();
        const inputText = item.input_text || '';
        const resultText = item.result_text || '';
        let score = null;
        // 諛깆뿏???뚯꽌媛 異붿텧???먯닔 ?곗꽑 ?ъ슜 (?꾨줎???뺢퇋?앸낫???뺥솗)
        if (item.total_score != null) {
          score = item.total_score;
        } else {
          const m = resultText.match(/醫낇빀\s*?먯닔[^0-9]*(\d{1,3}(?:\.\d+)?)/);
          if (m) score = parseFloat(m[1]);
        }
        const now = new Date().toISOString();

        // 泥?以?= ?쒕ぉ, ?꾩껜 ?띿뒪??= ?댁슜 textarea???쒖떆
        const lines = inputText.split('\n');
        const title = (lines[0] || '').trim().slice(0, 100) || '遺덈윭??怨듭빟';

        if (importTargetBlock) {
          const parent = importTargetBlock.parentNode;
          const next = importTargetBlock.nextSibling;
          importTargetBlock.remove();
          const tempDiv = document.createElement('div');
          parent.insertBefore(tempDiv, next);
          addPledgeRow(title, inputText, '', null, score, now, resultText, true);
          const newBlock = pledgesContainer.lastElementChild;
          parent.insertBefore(newBlock, tempDiv);
          tempDiv.remove();
          renumberPledges();
        } else {
          addPledgeRow(title, inputText, '', null, score, now, resultText, true);
        }
        importModal.classList.add('hidden');
        importTargetBlock = null;
      } catch (e) {
        console.error(e);
        alert('遺덈윭?ㅺ린 ?ㅽ뙣');
      }
    }

    loadData();
  </script>
  <p class="footer">
    <strong>媛쒗쁺?좊떦 ?뺤콉援?/strong><br>

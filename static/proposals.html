<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정책 제안 - 개혁신당</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <style>
    .success { display: none; }
    .btn-submit { width: 100%; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="wrap-sm">
    <div class="links" style="margin-bottom:1rem;">
      <a href="/">홈</a>
    </div>
    <h1>정�� 제안</h1>
    <p class="subtitle">개혁신당에 필요한 정책을 제안해 주세요. 제안은 정책국에서 검토합니다.</p>

    <div class="info-box">
      제안은 AI가 자동으로 주제를 분류하고, 정책국 검토 큐�� 등록됩니다. 채택된 제안은 정책 생성 파이프라인에 투입됩니다.
    </div>

    <div class="card" id="formCard">
      <label>제안 제목 <span class="required">*</span></label>
      <input type="text" id="title" placeholder="예: 청년 전세 사기 방지 제도 강화" maxlength="200">
      <div class="char-count"><span id="titleCount">0</span>/200</div>

      <label>제안 내용 <span class="required">*</span></label>
      <textarea id="body" placeholder="어떤 문제가 있고, 어떤 정책이 필요한지 설명해 주세요." maxlength="5000"></textarea>
      <div class="char-count"><span id="bodyCount">0</span>/5000</div>

      <label>이름 (선택, 익명 가능)</label>
      <input type="text" id="authorName" placeholder="홍길동" maxlength="50">

      <label>이메일 (선택, 검토 결과 수신용)</label>
      <input type="email" id="authorEmail" placeholder="example@email.com" maxlength="100">

      <p class="err" id="errMsg"></p>
      <button class="btn btn-full" id="submitBtn" onclick="submitProposal()">제안 제출</button>
    </div>

    <div class="success-box success" id="successMsg">
      <p style="font-weight:700; margin-bottom:0.5rem;">제안이 접수되었습니다!</p>
      <p id="successDetail"></p>
      <button class="btn" style="margin-top:0.75rem;" onclick="resetForm()">새 제안 작성</button>
    </div>
  </div>

  <script>
    document.getElementById('title').addEventListener('input', function() {
      document.getElementById('titleCount').textContent = this.value.length;
    });
    document.getElementById('body').addEventListener('input', function() {
      document.getElementById('bodyCount').textContent = this.value.length;
    });

    async function submitProposal() {
      const title = document.getElementById('title').value.trim();
      const body = document.getElementById('body').value.trim();
      const errEl = document.getElementById('errMsg');

      if (!title) { errEl.textContent = '제목을 입력해 주세요.'; errEl.style.display = 'block'; return; }
      if (body.length < 10) { errEl.textContent = '내용을 10자 이�� 입력해 주세요.'; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;

      try {
        const r = await fetch('/api/policy/proposals', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: title,
            body: body,
            author_name: document.getElementById('authorName').value.trim(),
            author_email: document.getElementById('authorEmail').value.trim(),
          }),
        });

        if (!r.ok) throw new Error('제출 실패 (' + r.status + ')');
        const data = await r.json();

        document.getElementById('formCard').style.display = 'none';
        const successEl = document.getElementById('successMsg');
        document.getElementById('successDetail').textContent =
          '제안 번호: #' + data.proposal_id + ' | 자동 분류: ' + data.classified_topic;
        successEl.style.display = 'block';
      } catch (e) {
        errEl.textContent = '오류: ' + (e.message || String(e));
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
      }
    }

    function resetForm() {
      document.getElementById('formCard').style.display = 'block';
      document.getElementById('successMsg').style.display = 'none';
      document.getElementById('title').value = '';
      document.getElementById('body').value = '';
      document.getElementById('titleCount').textContent = '0';
      document.getElementById('bodyCount').textContent = '0';
    }
  </script>
</body>
</html>

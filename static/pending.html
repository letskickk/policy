<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>승인 대기 - 정책 멘토링</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: linear-gradient(160deg, #04162b 0%, #073053 55%, #0a3b69 100%); min-height: 100vh; color: #e2e8f0; padding: 2rem; }
    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(148,163,184,0.18); border-radius: 18px; padding: 2rem; max-width: 500px; margin: 2rem auto; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #f8fafc; }
    p { line-height: 1.7; margin-bottom: 1rem; }
    .nav { margin-top: 1.5rem; }
    .nav a { color: #ffb37a; text-decoration: none; font-weight: 700; }
    .nav form { display: inline; }
    .nav button { background: none; border: none; color: #ffb37a; cursor: pointer; font-weight: 700; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>승인 대기 중</h1>
    <p>관리자 승인 후 분석 기능을 이용할 수 있습니다.</p>
    <p>승인이 완료되면 이 페이지에서 자동으로 대시보드로 이동합니다. 문의사항은 정책국(letskick@reformparty.kr)으로 연락해 주세요.</p>
    <div class="nav">
      <a href="/">메인으로</a> |
      <form action="/api/auth/logout" method="POST" style="display:inline">
        <button type="submit">로그아웃</button>
      </form>
    </div>
  </div>
</body>
</html>

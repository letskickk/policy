<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 사용량 - 정책 멘토링</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: linear-gradient(160deg, #04162b 0%, #073053 55%, #0a3b69 100%); min-height: 100vh; color: #e2e8f0; padding: 2rem; }
    .wrap { max-width: 640px; margin: 0 auto; }
    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(148,163,184,0.18); border-radius: 18px; padding: 1.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #f8fafc; }
    .stat { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .stat-item { background: rgba(0,0,0,0.2); padding: 0.75rem 1rem; border-radius: 12px; min-width: 140px; }
    .stat-item .v { font-size: 1.5rem; font-weight: 900; color: #fff; }
    .stat-item .l { font-size: 0.85rem; color: #94a3b8; }
    .links { margin-top: 1rem; }
    .links a { color: #ffb37a; text-decoration: none; font-weight: 700; margin-right: 1rem; }
    .links form { display: inline; }
    .links button { background: none; border: none; color: #ffb37a; cursor: pointer; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>내 사용량</h1>
    <div class="card">
      <div class="stat" id="stats">
        <div class="stat-item"><span class="l">오늘 사용</span><div class="v" id="daily">-</div><span class="l">/ <span id="dailyLimit">-</span> 회</span></div>
        <div class="stat-item"><span class="l">이번 달 사용</span><div class="v" id="monthly">-</div><span class="l">/ <span id="monthlyLimit">-</span> 회</span></div>
      </div>
      <div class="links">
        <span id="loginInfo" style="color:#94a3b8;font-size:0.9rem;margin-right:1rem;"></span>
        <a href="/pledge">공약 분석하기</a>
        <a href="/">메인</a>
        <form action="/api/auth/logout" method="POST" style="display:inline">
          <button type="submit">로그아웃</button>
        </form>
      </div>
    </div>
  </div>
  <script>
    (async () => {
      try {
        const r = await fetch('/api/usage/summary', { credentials: 'include' });
        if (!r.ok) { if (r.status === 401) window.location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
        const me = await fetch('/api/auth/me', { credentials: 'include' });
        if (me.ok) { const u = await me.json(); const el = document.getElementById('loginInfo'); if (el && u.email) el.textContent = u.email + ' 로그인 중'; }
        const d = await r.json();
        document.getElementById('daily').textContent = d.daily_used ?? '-';
        document.getElementById('monthly').textContent = d.monthly_used ?? '-';
        document.getElementById('dailyLimit').textContent = d.daily_limit ?? '-';
        document.getElementById('monthlyLimit').textContent = d.monthly_limit ?? '-';
      } catch (e) { console.error(e); }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 기록 - 정책 멘토링</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: linear-gradient(160deg, #04162b 0%, #073053 55%, #0a3b69 100%); min-height: 100vh; color: #e2e8f0; padding: 2rem; }
    .wrap { max-width: 640px; margin: 0 auto; }
    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(148,163,184,0.18); border-radius: 18px; padding: 1.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #f8fafc; }
    .stat { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .stat-item { background: rgba(0,0,0,0.2); padding: 0.75rem 1rem; border-radius: 12px; min-width: 140px; }
    .stat-item .v { font-size: 1.5rem; font-weight: 900; color: #fff; }
    .stat-item .l { font-size: 0.85rem; color: #94a3b8; }
    .nav { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; }
    .nav-links { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .nav-link {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 36px; padding: 0 0.9rem;
      color: #e2e8f0; text-decoration: none;
      font-size: 0.875rem; font-weight: 700;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(148,163,184,0.18);
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .nav-link:hover { background: rgba(255,255,255,0.10); color: #f8fafc; border-color: rgba(148,163,184,0.28); }
    .nav .logout-btn {
      min-height: 36px; padding: 0 0.9rem; font-size: 0.875rem; font-weight: 700;
      border-radius: 8px; border: 1px solid rgba(148,163,184,0.18);
      background: rgba(255,255,255,0.06); color: #e2e8f0;
      cursor: pointer; transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .nav .logout-btn:hover { background: rgba(255,255,255,0.10); color: #f8fafc; border-color: rgba(148,163,184,0.28); }
    .links { margin-top: 1rem; }
    .links a { color: #ffb37a; text-decoration: none; font-weight: 700; margin-right: 1rem; }
    .links form { display: inline; }
    .links button { background: none; border: none; color: #ffb37a; cursor: pointer; font-weight: 700; }
    @media (max-width: 560px) {
      .nav { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <h1 style="margin:0;">내 기록</h1>
      <div class="nav-links">
        <span id="loginInfo" style="color:#94a3b8;font-size:0.85rem;margin-right:0.25rem;align-self:center;"></span>
        <a href="/pledge" class="nav-link">공약 분석</a>
        <a href="/my-pledges" class="nav-link">내 공약</a>
        <a href="/" class="nav-link">메인</a>
        <form action="/api/auth/logout" method="POST" style="display:inline">
          <button type="submit" class="logout-btn">로그아웃</button>
        </form>
      </div>
    </div>
    <div class="card">
      <div class="stat" id="stats">
        <div class="stat-item"><span class="l">오늘 사용</span><div class="v" id="daily">-</div><span class="l">/ <span id="dailyLimit">-</span> 회</span></div>
        <div class="stat-item"><span class="l">이번 달 사용</span><div class="v" id="monthly">-</div><span class="l">/ <span id="monthlyLimit">-</span> 회</span></div>
      </div>
      <div class="links">
        <a href="/pledge">공약 분석하기</a>
        <a href="/my-pledges">내 공약 등록</a>
        <a href="/">메인</a>
        <form action="/api/auth/logout" method="POST" style="display:inline">
          <button type="submit">로그아웃</button>
        </form>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:1.15rem;margin:0 0 0.8rem 0;color:#f8fafc;">최근 분석 결과</h2>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin:-0.35rem 0 0.8rem 0;">
        <button id="historyRefresh" type="button" style="background:rgba(0,0,0,0.18);border:1px solid rgba(148,163,184,0.22);color:#ffb37a;border-radius:12px;padding:0.55rem 0.75rem;cursor:pointer;font-weight:900;">새로고침</button>
        <button id="historyClear" type="button" style="background:rgba(0,0,0,0.18);border:1px solid rgba(148,163,184,0.22);color:#fca5a5;border-radius:12px;padding:0.55rem 0.75rem;cursor:pointer;font-weight:900;">전체 삭제</button>
      </div>
      <div id="historyEmpty" style="display:none;color:#94a3b8;font-size:0.95rem;">아직 저장된 분석 결과가 없습니다.</div>
      <div id="history" style="display:flex;flex-direction:column;gap:0.65rem;"></div>
    </div>
  </div>
  <script src="/static/js/check-result-render.js"></script>
  <script>
    (async () => {
      try {
        const r = await fetch('/api/usage/summary', { credentials: 'include' });
        if (!r.ok) { if (r.status === 401) window.location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
        const me = await fetch('/api/auth/me', { credentials: 'include' });
        if (me.ok) { const u = await me.json(); const el = document.getElementById('loginInfo'); if (el && u.email) el.textContent = u.email + ' 로그인 중'; }
        const d = await r.json();
        document.getElementById('daily').textContent = d.daily_used ?? '-';
        document.getElementById('monthly').textContent = d.monthly_used ?? '-';
        document.getElementById('dailyLimit').textContent = d.daily_limit ?? '-';
        document.getElementById('monthlyLimit').textContent = d.monthly_limit ?? '-';

        const esc = (s) => (s ?? '').toString().replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
        const fmt = (iso) => {
          try { return new Date(iso.replace(' ', 'T') + 'Z').toLocaleString(); } catch { return iso || ''; }
        };

        async function loadHistory() {
          const hr = await fetch('/api/history?limit=15', { credentials: 'include' });
          if (!hr.ok) return;
          const hd = await hr.json();
          const items = hd.items || [];
          const wrap = document.getElementById('history');
          const empty = document.getElementById('historyEmpty');
          if (!items.length) { empty.style.display = 'block'; wrap.innerHTML = ''; return; }
          empty.style.display = 'none';
          wrap.innerHTML = '';

          for (const it of items) {
            const row = document.createElement('div');
            row.style.background = 'rgba(0,0,0,0.18)';
            row.style.border = '1px solid rgba(148,163,184,0.18)';
            row.style.borderRadius = '14px';
            row.style.padding = '0.85rem 0.9rem';

            const kindLabel = it.kind === 'verify' ? '검증' : '점검';
            const title = `[${kindLabel}] ${fmt(it.created_at)}${it.from_cache ? ' (캐시)' : ''}`;
            const inputPrev = it.input_preview || '';
            const resultPrev = it.result_preview || '';

            row.innerHTML = `
              <div style="display:flex;align-items:center;justify-content:space-between;gap:0.75rem;">
                <div style="font-weight:900;color:#f8fafc;font-size:0.95rem;">${esc(title)}</div>
                <div style="display:flex;gap:0.5rem;align-items:center;">
                  <button data-open="1" type="button" style="background:none;border:none;color:#ffb37a;cursor:pointer;font-weight:900;">열기</button>
                  <button data-del="1" type="button" style="background:none;border:none;color:#fca5a5;cursor:pointer;font-weight:900;">삭제</button>
                </div>
              </div>
              <div style="margin-top:0.45rem;color:#cbd5e1;font-size:0.9rem;line-height:1.5;">
                <div style="opacity:0.85"><span style="color:#94a3b8">입력</span> · ${esc(inputPrev)}</div>
                <div style="margin-top:0.35rem;opacity:0.9"><span style="color:#94a3b8">결과</span> · ${esc(resultPrev)}</div>
              </div>
            `;

            row.querySelector('button[data-open]').addEventListener('click', async () => {
              const ir = await fetch('/api/history/' + encodeURIComponent(it.id), { credentials: 'include' });
              if (!ir.ok) return;
              const item = await ir.json();
              const w = window.open('', '_blank');
              if (!w) { alert('팝업이 차단되었습니다. 브라우저 설정을 확인하세요.'); return; }
              w.document.title = '분석 결과 #' + item.id;

              if (it.kind === 'check' && item.result_format === 'text' && window.CheckResultRender) {
                const resultHtml = window.CheckResultRender.buildResultHtml(item.result_text || '');
                const printCss = `
                  * { box-sizing: border-box; }
                  body { font-family: "Malgun Gothic", sans-serif; background: #04162b; color: #f1f5f9; padding: 1.5rem; max-width: 880px; margin: 0 auto; line-height: 1.7; }
                  .score-board { display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap; padding:1rem 1.2rem; border-radius:14px; background: linear-gradient(135deg, rgba(255,114,16,0.12), rgba(56,189,248,0.10)); border:1px solid rgba(255,114,16,0.25); margin-bottom: 0.85rem; }
                  .score-board .score { font-size: 1.6rem; font-weight: 900; }
                  .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 0.3rem 0.8rem; font-size: 0.82rem; font-weight: 800; }
                  .badge.green { background: rgba(34,197,94,0.18); color: #86efac; }
                  .badge.yellow { background: rgba(250,204,21,0.18); color: #fef08a; }
                  .badge.red { background: rgba(248,113,113,0.18); color: #fca5a5; }
                  .score-cards-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
                  .score-card { flex: 1 1 auto; min-width: 110px; padding: 0.55rem 0.7rem; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(148,163,184,0.25); background: rgba(255,255,255,0.05); font-size: 0.8rem; }
                  .score-card.good { border-color: rgba(34,197,94,0.45); }
                  .score-card.mid { border-color: rgba(250,204,21,0.45); }
                  .score-card.low { border-color: rgba(248,113,113,0.45); }
                  .section-cards { margin-top: 0.9rem; display: flex; flex-direction: column; gap: 0.7rem; }
                  .section-card { border: 1px solid rgba(148,163,184,0.28); border-radius: 12px; background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03)); overflow: hidden; }
                  .section-card-head { display: flex; align-items: center; justify-content: space-between; padding: 0.55rem 0.8rem; border-bottom: 1px solid rgba(148,163,184,0.22); background: rgba(2,6,23,0.25); }
                  .section-card-title { font-weight: 900; font-size: 0.94rem; }
                  .section-card-body { padding: 0.7rem 0.8rem; line-height: 1.7; }
                  .section-line { margin-top: 0.35rem; }
                  .section-line.item { margin-top: 0.5rem; }
                  .line-tag { font-size: 0.75rem; font-weight: 800; color: #93c5fd; border: 1px solid rgba(147,197,253,0.4); border-radius: 999px; padding: 0.15rem 0.5rem; }
                  .analysis-text { margin-top: 0.5rem; white-space: pre-wrap; word-break: break-word; }
                `;
                w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><style>' + printCss + '</style></head><body><div class="result-content">' + resultHtml + '</div><p style="margin-top:1.5rem;color:#94a3b8;font-size:0.9rem;">입력 공약</p><pre style="white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,0.2);padding:1rem;border-radius:10px;font-size:0.9rem;">' + esc(item.input_text || '') + '</pre></body></html>');
              } else {
                let txt = item.result_text;
                if (item.result_format === 'json') {
                  try { txt = JSON.stringify(JSON.parse(item.result_text), null, 2); } catch {}
                }
                const content = `[#${item.id}] ${kindLabel} · ${fmt(item.created_at)}\n\n[입력]\n${item.input_text}\n\n[결과]\n${txt}`;
                w.document.body.style.margin = '0';
                w.document.body.innerHTML = '<pre style="white-space:pre-wrap;word-break:break-word;padding:16px;font-family:ui-monospace, monospace;">' + esc(content) + '</pre>';
              }
              w.document.close();
            });

            row.querySelector('button[data-del]').addEventListener('click', async () => {
              if (!confirm('이 결과를 삭제할까요?')) return;
              const dr = await fetch('/api/history/' + encodeURIComponent(it.id) + '/delete', { method: 'POST', credentials: 'include' });
              if (!dr.ok) return;
              await loadHistory();
            });

            wrap.appendChild(row);
          }
        }

        document.getElementById('historyRefresh')?.addEventListener('click', loadHistory);
        document.getElementById('historyClear')?.addEventListener('click', async () => {
          if (!confirm('저장된 분석 결과를 모두 삭제할까요?')) return;
          const cr = await fetch('/api/history/clear', { method: 'POST', credentials: 'include' });
          if (!cr.ok) return;
          await loadHistory();
        });

        await loadHistory();
      } catch (e) { console.error(e); }
    })();
  </script>
</body>
</html>

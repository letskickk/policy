<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사용량 대시보드 - 정책 멘토링</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: linear-gradient(160deg, #04162b 0%, #073053 55%, #0a3b69 100%); min-height: 100vh; color: #e2e8f0; padding: 2rem; }
    .wrap { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #f8fafc; }
    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(148,163,184,0.18); border-radius: 18px; padding: 1.5rem; margin-bottom: 1rem; }
    .links { margin-bottom: 1rem; }
    .links a { color: #ffb37a; text-decoration: none; font-weight: 700; margin-right: 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.6rem; text-align: left; border-bottom: 1px solid rgba(148,163,184,0.2); }
    select { padding: 0.4rem 0.75rem; border-radius: 10px; background: rgba(0,0,0,0.22); color: #fff; border: 1px solid rgba(148,163,184,0.28); margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="links"><a href="/admin">← 관리자</a></div>
    <h1>사용량 대시보드</h1>
    <div class="card">
      <label>기간: </label>
      <select id="period" onchange="load()">
        <option value="7">최근 7일</option>
        <option value="30">최근 30일</option>
        <option value="90">최근 90일</option>
      </select>
      <table>
        <thead>
          <tr><th>사용자</th><th>호출 횟수</th><th>비용 추정</th></tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>
  </div>
  <script>
    async function load() {
      const period = document.getElementById('period').value;
      const r = await fetch(`/api/admin/usage/stats?period=${period}`, { credentials: 'include' });
      if (!r.ok) return;
      const d = await r.json();
      const tbody = document.getElementById('list');
      tbody.innerHTML = '';
      for (const row of d.by_user || []) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${row.email || row.user_id}</td><td>${row.count}</td><td>${(row.cost_estimate || 0).toFixed(6)}</td>`;
        tbody.appendChild(tr);
      }
    }
    load();
  </script>
</body>
</html>

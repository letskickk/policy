<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - 정책 멘토링</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <style>
    h1 { margin-bottom: 1.5rem; }
    .card a { color: var(--brand-light); text-decoration: none; font-weight: 700; font-size: 1.1rem; }
    .card a:hover { text-decoration: underline; }
    .links form { display: inline; }
    .links button { background: none; border: none; color: var(--brand-light); cursor: pointer; font-weight: 700; font-family: inherit; }
    #pendingCount { font-weight: 900; color: #fbbf24; }
    #pledgePendingCount { font-weight: 900; color: #fde047; }
  </style>
</head>
<body>
  <div class="wrap-md">
    <h1>관리자</h1>
    <div class="card">
      <p style="margin-bottom: 0.5rem;">사용자 승인 대기: <span id="pendingCount">0</span>명</p>
      <p style="margin-bottom: 0.5rem;">공약 승인 대기: <span id="pledgePendingCount">0</span>건</p>
      <p style="margin-bottom: 1rem;">시민 제안 (신규): <span id="proposalCount" style="font-weight:900;color:#a78bfa;">0</span>건</p>
      <div class="links">
        <a href="/admin/users">사용자 관리 (승인/거절)</a><br><br>
        <a href="/admin/candidates">출마자·공약 관리 (등록/승인/거절)</a><br><br>
        <a href="/admin/policy-ssot">정책 SSOT 관리</a><br><br>
        <a href="/admin/issue-radar">이슈 레이더 (정책 사각지대)</a><br><br>
        <a href="/policy-create">정책 생성 (AI 드래프터)</a><br><br>
        <a href="/proposals">시민 정책 제안</a><br><br>
        <a href="/admin/usage">사용량 통계</a><br><br>
        <a href="/admin/ops">운영 상태 (벡터스토어·PDF)</a><br><br>
        <a href="/map">지역별 후보 지도</a><br><br>
        <a href="/my-pledges">내 공약 등록</a> · <a href="/dashboard">내 기록</a>
        <form action="/api/auth/logout" method="POST" style="display:inline; margin-left:1rem">
          <button type="submit">로그아웃</button>
        </form>
      </div>
    </div>
  </div>
  <script>
    (async () => {
      try {
        const r = await fetch('/api/admin/users/pending', { credentials: 'include' });
        if (r.ok) { const d = await r.json(); document.getElementById('pendingCount').textContent = (d.users || []).length; }
      } catch (e) {}
      try {
        const r2 = await fetch('/api/admin/candidates', { credentials: 'include' });
        if (r2.ok) {
          const list = await r2.json();
          const pending = (Array.isArray(list) ? list : []).filter(c => (c.approval_status || 'PENDING') === 'PENDING').length;
          document.getElementById('pledgePendingCount').textContent = pending;
        }
      } catch (e) {}
      try {
        const r3 = await fetch('/api/policy/proposals?status=new', { credentials: 'include' });
        if (r3.ok) { const list = await r3.json(); document.getElementById('proposalCount').textContent = (Array.isArray(list) ? list : []).length; }
      } catch (e) {}
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 - 정책 멘토링</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: linear-gradient(160deg, #04162b 0%, #073053 55%, #0a3b69 100%); min-height: 100vh; color: #e2e8f0; padding: 2rem; }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #f8fafc; }
    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(148,163,184,0.18); border-radius: 18px; padding: 1.5rem; margin-bottom: 1rem; }
    .card a { color: #ffb37a; text-decoration: none; font-weight: 700; font-size: 1.1rem; }
    .card a:hover { text-decoration: underline; }
    .links a { margin-right: 1rem; }
    .links form { display: inline; }
    .links button { background: none; border: none; color: #ffb37a; cursor: pointer; font-weight: 700; }
    #pendingCount { font-weight: 900; color: #fbbf24; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>관리자</h1>
    <div class="card">
      <p style="margin-bottom: 1rem;">승인 대기: <span id="pendingCount">0</span>명</p>
      <div class="links">
        <a href="/admin/users">사용자 관리 (승인/거절)</a><br><br>
        <a href="/admin/usage">사용량 통계</a><br><br>
        <a href="/dashboard">내 기록</a>
        <form action="/api/auth/logout" method="POST" style="display:inline; margin-left:1rem">
          <button type="submit">로그아웃</button>
        </form>
      </div>
    </div>
  </div>
  <script>
    (async () => {
      try {
        const r = await fetch('/api/admin/users/pending', { credentials: 'include' });
        if (r.ok) { const d = await r.json(); document.getElementById('pendingCount').textContent = (d.users || []).length; }
      } catch (e) {}
    })();
  </script>
</body>
</html>

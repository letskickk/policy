description: "policy T1 harness: live coach + verify endpoint evaluation"

providers:
  - file://providers/policy-local-provider.mjs

prompts:
  - "{{pledge}}"

tests:
  - description: "coach concrete pledge returns structured six-section analysis"
    metadata:
      mode: coach
      expectation: coach_concrete
    vars:
      analysis_mode: coach
      pledge: "강남구 어르신 돌봄 사각지대 해소를 위해 동별 1개소 이상 주간보호센터를 설치하고, 독거노인 2000명을 대상으로 안부 확인 시스템을 도입하겠습니다."
    assert:
      - type: javascript
        value: |
          const required = [
            /1\.\s*개혁신당.*부합성/,
            /2\.\s*개혁신당.*유사성/,
            /3\..*2022.*공약.*비교/,
            /4\.\s*우리.*공약.*비교/,
            /5\.\s*총평/,
            /6\.\s*수정.*보완.*제안/,
          ];
          const missing = required.filter((pattern) => !pattern.test(output)).map((pattern) => pattern.toString());
          return missing.length === 0
            ? { pass: true, score: 1, reason: 'all six sections present' }
            : { pass: false, score: 0, reason: `missing sections: ${missing.join(', ')}` };
      - type: javascript
        value: |
          const hasGrade = /종합해석\s*등급:\s*(S|A\+|A|B\+|B|C\+|C|D\+|D|F)/.test(output);
          const hasScore = /종합\s*점수:\s*\d{1,3}/.test(output) || /총점:\s*\d{1,3}/.test(output);
          return hasGrade && hasScore
            ? { pass: true, score: 1, reason: 'grade and score present' }
            : { pass: false, score: 0, reason: 'grade or score missing' };

  - description: "coach authority mismatch is penalized and explained"
    metadata:
      mode: coach
      expectation: coach_authority_mismatch
    vars:
      analysis_mode: coach
      pledge: "기초의원으로 출마해 한미 FTA를 전면 재협상하고 교육부 권한을 조정하겠습니다."
    assert:
      - type: javascript
        value: |
          const grade = output.match(/종합해석\s*등급:\s*(S|A\+|A|B\+|B|C\+|C|D\+|D|F)/);
          if (!grade) return { pass: false, score: 0, reason: 'grade missing' };
          const allowed = ['C+', 'C', 'D+', 'D', 'F'];
          return allowed.includes(grade[1])
            ? { pass: true, score: 1, reason: `grade ${grade[1]}` }
            : { pass: false, score: 0, reason: `grade too high: ${grade[1]}` };
      - type: javascript
        value: |
          const lowered = output.includes('권한') || output.includes('지방') || output.includes('실행 주체');
          return lowered
            ? { pass: true, score: 1, reason: 'authority mismatch mentioned' }
            : { pass: false, score: 0, reason: 'authority mismatch not explained' };

  - description: "coach slogan-like pledge is treated as underspecified"
    metadata:
      mode: coach
      expectation: coach_slogan
    vars:
      analysis_mode: coach
      pledge: "강남을 바꾸겠습니다!"
    assert:
      - type: javascript
        value: |
          const grade = output.match(/종합해석\s*등급:\s*(S|A\+|A|B\+|B|C\+|C|D\+|D|F)/);
          if (!grade) return { pass: false, score: 0, reason: 'grade missing' };
          const allowed = ['C', 'D+', 'D', 'F'];
          return allowed.includes(grade[1])
            ? { pass: true, score: 1, reason: `grade ${grade[1]}` }
            : { pass: false, score: 0, reason: `grade too high: ${grade[1]}` };
      - type: javascript
        value: |
          const ok = output.includes('구체') || output.includes('명칭만') || output.includes('보완');
          return ok
            ? { pass: true, score: 1, reason: 'underspecified nature mentioned' }
            : { pass: false, score: 0, reason: 'missing underspecified explanation' };

  - description: "verify endpoint returns normalized rich JSON for a concrete pledge"
    metadata:
      mode: verify
      expectation: verify_concrete
    vars:
      analysis_mode: verify
      phase: quick
      top_k_platform: 4
      top_k_pledge: 4
      top_k_regional: 5
      pledge: "강남구 어르신 돌봄 사각지대 해소를 위해 동별 1개소 이상 주간보호센터를 설치하고, 독거노인 2000명을 대상으로 안부 확인 시스템을 도입하겠습니다."
    assert:
      - type: javascript
        value: |
          let data;
          try { data = JSON.parse(output); } catch (err) { return { pass: false, score: 0, reason: `invalid json: ${err.message}` }; }
          const ok = data && typeof data === 'object'
            && typeof data.total_score === 'number'
            && data.summary && typeof data.summary.fit_score === 'number'
            && Array.isArray(data.platform)
            && Array.isArray(data.pledges)
            && Array.isArray(data.conflicts)
            && Array.isArray(data.improvements)
            && data.evidence_map && typeof data.evidence_map === 'object';
          return ok
            ? { pass: true, score: 1, reason: 'normalized verify payload' }
            : { pass: false, score: 0, reason: 'verify payload missing normalized fields' };
      - type: javascript
        value: |
          const data = JSON.parse(output);
          const score = Number(data.total_score ?? data.summary?.fit_score ?? -1);
          return score >= 35 && score <= 85
            ? { pass: true, score: 1, reason: `concrete score ${score}` }
            : { pass: false, score: 0, reason: `concrete score out of range: ${score}` };
      - type: javascript
        value: |
          const data = JSON.parse(output);
          const evidenceIds = new Set(Object.keys(data.evidence_map || {}));
          const conflictEvidence = (data.conflicts || []).flatMap((item) => item.evidence || []);
          const bad = conflictEvidence.filter((id) => !/^R\d+$/.test(id) || !evidenceIds.has(id));
          return bad.length === 0
            ? { pass: true, score: 1, reason: 'conflict evidence ids are regional and valid' }
            : { pass: false, score: 0, reason: `bad conflict evidence ids: ${bad.join(', ')}` };
      - type: javascript
        value: |
          const data = JSON.parse(output);
          const signal = String(data.signal_light || '').toLowerCase();
          return signal === 'yellow' || signal === 'green'
            ? { pass: true, score: 1, reason: `signal light ${signal}` }
            : { pass: false, score: 0, reason: `unexpected signal light: ${data.signal_light}` };

  - description: "verify authority mismatch is kept low and red"
    metadata:
      mode: verify
      expectation: verify_authority_mismatch
    vars:
      analysis_mode: verify
      phase: quick
      top_k_platform: 4
      top_k_pledge: 4
      top_k_regional: 5
      pledge: "기초의원으로 출마해 한미 FTA를 전면 재협상하고 교육부 권한을 조정하겠습니다."
    assert:
      - type: javascript
        value: |
          const data = JSON.parse(output);
          const score = Number(data.total_score ?? data.summary?.fit_score ?? 999);
          return score <= 40
            ? { pass: true, score: 1, reason: `authority mismatch score ${score}` }
            : { pass: false, score: 0, reason: `authority mismatch score too high: ${score}` };
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return String(data.signal_light || '').toLowerCase() === 'red'
            ? { pass: true, score: 1, reason: 'signal light red' }
            : { pass: false, score: 0, reason: `unexpected signal light: ${data.signal_light}` };
      - type: javascript
        value: |
          const data = JSON.parse(output);
          const improvements = Array.isArray(data.improvements) ? data.improvements : [];
          return improvements.length >= 2 && data.pdf_eligible === false
            ? { pass: true, score: 1, reason: `${improvements.length} improvements and pdf disabled` }
            : { pass: false, score: 0, reason: 'authority mismatch should have multiple improvements and pdf disabled' };

  - description: "verify slogan-like pledge is kept low and includes improvements"
    metadata:
      mode: verify
      expectation: verify_slogan
    vars:
      analysis_mode: verify
      phase: quick
      top_k_platform: 4
      top_k_pledge: 4
      top_k_regional: 5
      pledge: "강남을 바꾸겠습니다!"
    assert:
      - type: javascript
        value: |
          const data = JSON.parse(output);
          const score = Number(data.total_score ?? data.summary?.fit_score ?? 999);
          return score <= 45
            ? { pass: true, score: 1, reason: `slogan score ${score}` }
            : { pass: false, score: 0, reason: `slogan score too high: ${score}` };
      - type: javascript
        value: |
          const data = JSON.parse(output);
          const improvements = Array.isArray(data.improvements) ? data.improvements : [];
          return improvements.length >= 1
            ? { pass: true, score: 1, reason: `${improvements.length} improvements present` }
            : { pass: false, score: 0, reason: 'missing improvements' };
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return String(data.signal_light || '').toLowerCase() === 'red'
            ? { pass: true, score: 1, reason: 'signal light red' }
            : { pass: false, score: 0, reason: `unexpected signal light: ${data.signal_light}` };
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return data.pdf_eligible === false
            ? { pass: true, score: 1, reason: 'pdf disabled for slogan' }
            : { pass: false, score: 0, reason: 'slogan should not be pdf eligible' };

  - description: "verify vague numeric pledge stays cautious and asks for more detail"
    metadata:
      mode: verify
      expectation: verify_vague_numeric
    vars:
      analysis_mode: verify
      phase: quick
      top_k_platform: 4
      top_k_pledge: 4
      top_k_regional: 5
      pledge: "청년 1만명을 지원하는 미래혁신센터를 만들겠습니다."
    assert:
      - type: javascript
        value: |
          const data = JSON.parse(output);
          const score = Number(data.total_score ?? data.summary?.fit_score ?? 999);
          return score <= 60
            ? { pass: true, score: 1, reason: `vague numeric score ${score}` }
            : { pass: false, score: 0, reason: `vague numeric score too high: ${score}` };
      - type: javascript
        value: |
          const data = JSON.parse(output);
          const improvements = Array.isArray(data.improvements) ? data.improvements : [];
          return improvements.length >= 2
            ? { pass: true, score: 1, reason: `${improvements.length} improvements present` }
            : { pass: false, score: 0, reason: 'missing follow-up improvements for vague numeric pledge' };
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return String(data.signal_light || '').toLowerCase() !== 'green'
            ? { pass: true, score: 1, reason: `signal light ${data.signal_light}` }
            : { pass: false, score: 0, reason: 'vague numeric pledge should not be green' };

  - description: "verify query-like input stays very low and red"
    metadata:
      mode: verify
      expectation: verify_query_like
    vars:
      analysis_mode: verify
      phase: quick
      top_k_platform: 4
      top_k_pledge: 4
      top_k_regional: 5
      pledge: "강남 돌봄 정책"
    assert:
      - type: javascript
        value: |
          const data = JSON.parse(output);
          const score = Number(data.total_score ?? data.summary?.fit_score ?? 999);
          return score <= 25
            ? { pass: true, score: 1, reason: `query-like score ${score}` }
            : { pass: false, score: 0, reason: `query-like score too high: ${score}` };
      - type: javascript
        value: |
          const data = JSON.parse(output);
          const improvements = Array.isArray(data.improvements) ? data.improvements : [];
          return improvements.length >= 1 && data.pdf_eligible === false
            ? { pass: true, score: 1, reason: 'query-like input kept non-exportable with follow-up guidance' }
            : { pass: false, score: 0, reason: 'query-like input missing guidance or incorrectly exportable' };
      - type: javascript
        value: |
          const data = JSON.parse(output);
          return String(data.signal_light || '').toLowerCase() === 'red'
            ? { pass: true, score: 1, reason: 'signal light red' }
            : { pass: false, score: 0, reason: `unexpected signal light: ${data.signal_light}` };
